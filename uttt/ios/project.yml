# XcodeGen spec for Ultimate Tic-Tac-Toe.
#
# The .xcodeproj is a BUILD ARTIFACT - never hand-edit it, never commit it.
#
# BOOTSTRAP ORDER (from a clean checkout):
#   1. make -C ../c ios-lib      # writes ios/vendor/Uttt.xcframework
#   2. xcodegen generate
#   3. xcodebuild -scheme UtttMessagesApp -destination 'generic/platform=iOS Simulator' build
# Step 1 must run first: UtttKit links vendor/Uttt.xcframework, which is not in
# git because it is generated.
#
# THREE TARGETS, inherited from the fork for one reason worth stating: an app
# extension cannot be distributed on its own, so the iMessage game needs a
# codeless container to carry it. That container EMBEDS the framework without
# linking against it - @rpath for an extension resolves into its containing
# app's Frameworks/, so without the embed the bundle builds clean and then
# fails to load at runtime.
#
# WHAT THIS HAS NONE OF: no network stack, no accounts, no database. The whole
# game is twenty-two bytes in the message URL, so there is nothing to talk to.
name: Uttt
options:
  bundleIdPrefix: cards.uttt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # A WARNING THAT SHIPS IS A DEFECT. Swift warns when an optional is
    # interpolated into a string, and that warning scrolled past in a build
    # log while the characters `Optional("X")` went out in a caption to
    # another human. There is no warning in this target worth keeping.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8N2Z544SB4
    ITSAppUsesNonExemptEncryption: "NO"

configs:
  Debug: debug
  Release: release

targets:
  UtttMessagesApp:
    type: application.messages
    platform: iOS
    # AN APP WITH NO ENTITLEMENTS DOES NOT REGISTER. installd says "Install
    # successful", LaunchServices then refuses to bind it, and every later
    # simctl command answers "No such file or directory" about an app that is
    # sitting in the bundle container. The log line that gives it away is
    # `Executable for cards.uttt.msg ... had no entitlements`. xcodegen writes
    # these from the properties below, so there is no committed file for
    # `xcodegen generate` to blank.
    entitlements:
      path: UtttMessagesApp/UtttMessagesApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cards.uttt.msg
    sources:
      - path: UtttMessagesApp
    dependencies:
      - target: UtttMessages
        embed: true
      # Must be embedded here even though the container has no code: it only
      # has to CARRY the binary. link:false because there is nothing to link.
      - target: UtttKit
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.uttt.msg
        INFOPLIST_FILE: UtttMessagesApp/Info.plist
        # The CONTAINER needs one too. It is launch-prohibited and shows no
        # UI, but LaunchServices will not register an app with no icon -
        # installd reports "Install successful" and the bundle is then
        # invisible to every other simctl command.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # BOTH, and the order of that sentence is the bug. A hand-written
        # Info.plist is NOT a whole Info.plist: CFBundleIdentifier,
        # CFBundleExecutable, CFBundlePackageType and CFBundleVersion are
        # synthesised, and without this the bundle builds clean and then
        # `simctl install` says "Missing bundle ID". Xcode merges the
        # generated keys into the file named above, so the NSExtension
        # dictionary the appex needs survives.
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  UtttMessages:
    type: app-extension.messages
    platform: iOS
    # The SAME group as its container - this is where the rig's dev.* files
    # land and where anything the two halves share would live.
    entitlements:
      path: UtttMessages/UtttMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cards.uttt.msg
    sources:
      - path: UtttMessages
    dependencies:
      - target: UtttKit
    settings:
      base:
        # Prefixed by its CONTAINER - an extension's bundle id must extend the
        # app that embeds it.
        PRODUCT_BUNDLE_IDENTIFIER: cards.uttt.msg.MessagesExtension
        INFOPLIST_FILE: UtttMessages/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"   # see the container target above
        # AN iMESSAGE APP WITHOUT AN ICON DOES NOT INSTALL, and it does not
        # say so: `simctl install` exits 0 and registers nothing, so the next
        # command fails with "no such app" and blames itself. The catalog must
        # be a .stickersiconset (not .appiconset) on the EXTENSION, because the
        # `+` drawer takes its row from here.
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        TARGETED_DEVICE_FAMILY: "1"

  # ---- A development harness, shipped in nothing -------------------------
  # The only other way to look at a screen is to drive the real Messages app,
  # and a design that can only be inspected by playing a game is a design
  # nobody inspects.
  UtttPreview:
    type: application
    platform: iOS
    sources:
      - path: UtttPreview
    dependencies:
      - target: UtttKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.uttt.preview
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  UtttKit:
    type: framework
    platform: iOS
    sources:
      - path: UtttKit
      # The kernel binding lives in the repo's sdk/, sibling to c/ - it is the
      # boundary, not a UI file.
      - path: ../sdk/swift
    dependencies:
      # STATIC (embed:false), so the linker pulls it in per object and nothing
      # unreferenced ships.
      - framework: vendor/Uttt.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.uttt.kit
        GENERATE_INFOPLIST_FILE: "YES"
        # The clang module map that lets Swift `import CUttt`, copied into
        # BUILT_PRODUCTS_DIR/include by the xcframework.
        HEADER_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)/include
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  UtttPreview:
    build:
      targets:
        UtttPreview: all
    run:
      config: Debug
  UtttMessagesApp:
    build:
      targets:
        UtttMessagesApp: all
    run:
      config: Debug
