# uttt.live: the Ultimate Tic-Tac-Toe replay site, static, deployed by ./cbase (cbase/tools/cbase,
# the submodule at the repository's root). Run from this directory:
#   ../cbase/tools/cbase deploy
CBASE_APP = uttt
CBASE_VM = none
# The one static group (bucket) foolish and utils use too, in the folder uttt/.
CBASE_STATIC = foolish
# The Next static export (npm run build in uttt/web/).
CBASE_STATIC_DIR = web/out
CBASE_HASHED = _next/static/*
CBASE_DOMAIN = uttt.live www.uttt.live
# Every path that is not a file or a known page is the shell, a 200; the app routes it, the old
# /234 -> /243 among it (web/lib/shell.ts). index.html is the home page, so not that.
CBASE_SHELL = /_shell.html
