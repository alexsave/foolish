# foolish.cards: the app's server on the live cbase-vm VM and its website in the live web bucket,
# deployed by ./cbase (cbase/tools/cbase, the submodule at the repository's root), which ADOPTS
# what runs today (Alex, 2026-11-09): no new VM, bucket or certificate. Run from this directory:
#   CBASE_SERVE_BIN=../c_base/dist/cbase-serve-linux-arm64 ../cbase/tools/cbase deploy
# The server is c_base's static release build (c_base/providers/aws/ops/build_bootstrap.sh serve),
# not cbase.mk's make serve-binary, so CBASE_SERVE_BIN always names it. CUTOVER.md at the
# repository's root is the switch. Every value below was read from the live stacks.
# No secret goes in this file: the server's settings are the SSM parameters under /cbase-vm/env/.
CBASE_APP = foolish
# The VM: the cbase-vm stack's one instance (an auto-scaling group of one, IPv6-only), reached by
# CloudFront at the AAAA name of its fixed ::10, on the port and data folder it has always used.
# The servers go to the adopted default, s3://cbase-code-<account>-<region>/vm/foolish/, which the
# role reads (vm/*) and vm_release.sh's prune (vm/cbase-serve-* alone) never touches.
CBASE_VM = foolish
CBASE_VM_STACK = cbase-vm
CBASE_VM_ORIGIN = vm-origin.foolish.cards
CBASE_VM_PORT = 8080
CBASE_VM_DATA = /var/lib/cbase
CBASE_VM_REPLACES = cbase.service
CBASE_VM_SETTINGS = /cbase-vm/env/
# The backups stay where the instance's boot restores them from.
CBASE_BACKUP_BUCKET = cbase-vm-backupbucket-whuc9g4lhome
CBASE_BACKUP_KEY = cbase/latest.sqlite
# Memory is not declared: the service has no hard cap, as on cbase-vm today, and the fit check
# counts it at 128M (it idles near 25 MiB).
# The files: the live web bucket's foolish/ folder.
CBASE_STATIC_BUCKET = cbase-web-487337210065
CBASE_STATIC_PREFIX = foolish
# The Next static export (npm run build in foolish/).
CBASE_STATIC_DIR = out
CBASE_HASHED = _next/static/*
CBASE_DOMAIN = foolish.cards www.foolish.cards
CBASE_CERT_ARN = arn:aws:acm:us-east-1:487337210065:certificate/42ecb64e-bf84-4372-9170-2e645119b12f
CBASE_API_HOST = api.foolish.cards
CBASE_API_CERT_ARN = arn:aws:acm:us-east-1:487337210065:certificate/30120b19-e9b9-419c-b3a2-6ce73f2e8765
# The two public reads the API host caches as the server's Cache-Control says.
CBASE_API_ROUTE = /v1/leaderboard vm origin GET,HEAD,OPTIONS
CBASE_API_ROUTE = /v1/bots vm origin GET,HEAD,OPTIONS
# The realtime sockets, on the API host as today.
CBASE_API_ROUTE = /mqtt* ws
CBASE_API_ROUTE = /ws* ws
# Every path that is not a file or a known page is the app shell, a 200; the app routes it
# (src/utils/gameShell.ts). Not index.html: that is the home page, and the export writes the game
# route's one prerendered page as _shell.html.
CBASE_SHELL = /_shell.html
# The link unfurl (server/src/app/unfurl_http.c), cached as its own Cache-Control says.
CBASE_ROUTE = /m/* vm cache GET,HEAD
