# XcodeGen spec for Foolish (docs/IOS_APP_DESIGN.md §4, §16.A4).
#
# The .xcodeproj is a BUILD ARTIFACT — never hand-edit it, never commit it.
# Regenerate with `xcodegen generate` (brew install xcodegen). Every project
# change is reviewable here in text.
#
# BOOTSTRAP ORDER (from a clean checkout):
#   1. cd ../cnitro && make ios-lib      # builds ios/vendor/Foolish.xcframework
#   2. cd ../ios && xcodegen generate    # writes Foolish.xcodeproj
#   3. open Foolish.xcodeproj            # or xcodebuild ... (see README)
# Step 1 must run first: FoolishKit links vendor/Foolish.xcframework, which does
# not exist in git (it is generated). See ios/README.md.

name: Foolish
options:
  bundleIdPrefix: cards.foolish
  # 16.0, not the doc's 15.0 starter: the signature SF Compressed numerals
  # (Font.width(.compressed), §5.2) and ShareLink (§16.C2) are iOS 16 APIs, and
  # iOS 15's install share is negligible for a 2026 launch. The C engine still
  # builds at -miphoneos-version-min=15.0 (harmless; the app links it at 16).
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # v1 develops against the simulator only — no signing anywhere (§16.0).
    # Milestone F flips CODE_SIGN_STYLE to Automatic and sets DEVELOPMENT_TEAM.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    # Standard HTTPS only — no non-exempt encryption (§11).
    ITSAppUsesNonExemptEncryption: "NO"

configs:
  Debug: debug
  Release: release

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  # Declared for Milestone D (online play, §16.D1). Add `{ package: Supabase }`
  # to FoolishKit's dependencies when Net/ starts calling the edge functions /
  # realtime; it is only resolved, not linked, until then.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  # ---- The app -----------------------------------------------------------
  Foolish:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: FoolishApp/Foolish.entitlements
    sources:
      - path: FoolishApp
    dependencies:
      - target: FoolishKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.app
        INFOPLIST_FILE: FoolishApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only in v1 (§2 non-goals)

  # ---- Shared framework: Engine + Net + DesignSystem + Boards + Entitlements
  FoolishKit:
    type: framework
    platform: iOS
    sources:
      - path: FoolishKit
      - path: Entitlements
    dependencies:
      # The C engine, built by `make ios-lib` in ../cnitro. Static (embed:false).
      - framework: vendor/Foolish.xcframework
        embed: false
      # Online play (§16.D): auth, edge functions, realtime.
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.kit
        DEFINES_MODULE: "YES"
        # A framework needs an Info.plist; with no INFOPLIST_FILE we let Xcode
        # synthesize one (XcodeGen leaves GENERATE_INFOPLIST_FILE=NO otherwise,
        # so the .framework ships without a plist and packaging fails).
        GENERATE_INFOPLIST_FILE: "YES"
        # APPLICATION_EXTENSION_API_ONLY is turned on in Milestone G, when the
        # iMessage extension actually links FoolishKit and an extension-safe
        # subset (Engine/DesignSystem/Boards, no app-only APIs) is split out.
        # Enabling it now would forbid app-only APIs the app legitimately uses.

  # ---- Unit + snapshot + golden tests ------------------------------------
  FoolishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoolishTests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: Foolish
      - target: FoolishKit
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.tests
        # Same as FoolishKit: let Xcode synthesize the test bundle's Info.plist.
        GENERATE_INFOPLIST_FILE: "YES"

  # ---- UI tests: drive a full offline game end-to-end (§6 screen 3/4) ------
  FoolishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FoolishUITests
    dependencies:
      - target: Foolish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Foolish

schemes:
  Foolish:
    build:
      targets:
        Foolish: all
        FoolishKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoolishTests
        - FoolishUITests
