# XcodeGen spec for Foolish (docs/IOS_APP_DESIGN.md §4, §16.A4).
#
# The .xcodeproj is a BUILD ARTIFACT — never hand-edit it, never commit it.
# Regenerate with `xcodegen generate` (brew install xcodegen). Every project
# change is reviewable here in text.
#
# BOOTSTRAP ORDER (from a clean checkout):
#   1. cd ../c && make ios-lib      # builds ios/vendor/Foolish.xcframework
#   2. cd ../ios && xcodegen generate    # writes Foolish.xcodeproj
#   3. open Foolish.xcodeproj            # or xcodebuild ... (see README)
# Step 1 must run first: FoolishKit links vendor/Foolish.xcframework, which does
# not exist in git (it is generated). See ios/README.md.

name: Foolish
options:
  bundleIdPrefix: cards.foolish
  # 16.0, not the doc's 15.0 starter: the signature SF Compressed numerals
  # (Font.width(.compressed), §5.2) and ShareLink (§16.C2) are iOS 16 APIs, and
  # iOS 15's install share is negligible for a 2026 launch. The C engine still
  # builds at -miphoneos-version-min=15.0 (harmless; the app links it at 16).
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.9"
    # Milestone F: signing enabled. Xcode manages the certificate + provisioning
    # profiles automatically against the registered App IDs (cards.foolish.app,
    # cards.foolish.app.MessagesExtension) and App Group (group.cards.foolish).
    # DEVELOPMENT_TEAM is the 10-char Team ID from the portal's Membership page.
    # Simulator builds still need no signing; Xcode skips it for the sim SDK.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8N2Z544SB4
    # Standard HTTPS only — no non-exempt encryption (§11).
    ITSAppUsesNonExemptEncryption: "NO"

configs:
  Debug: debug
  Release: release

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  # Online play (§16.D1). Linked by FoolishNet ONLY — never FoolishKit, or the
  # iMessage extension picks up a network stack it never uses (scripts/
  # lint_architecture.sh fails the build if it creeps back).
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  # ---- The app -----------------------------------------------------------
  Foolish:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: FoolishApp/Foolish.entitlements
    sources:
      - path: FoolishApp
    dependencies:
      - target: FoolishKit
      - target: FoolishNet
      # NOTE: the iMessage extension is deliberately NOT embedded here anymore.
      # It ships in its own app record (FoolishMessagesApp) so the offline
      # iMessage game can reach the store without waiting on this app's Chain-A
      # blockers (staging backend, auth rebuild, account deletion, online
      # privacy labels) — none of which a no-account offline extension has.
      #
      # Re-embedding later is a normal app update, not a re-architecture
      # (docs/IMESSAGE_SHIP_BLOCKERS.md §2; IMESSAGE_IMPLEMENTATION_HANDOFF.md
      # §3.5), and cards.foolish.app.MessagesExtension stays registered for it.
      # If it is re-added, DROP the standalone first or a user with both
      # installed gets two Foolish entries in the Messages drawer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.app
        INFOPLIST_FILE: FoolishApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only in v1 (§2 non-goals)

  # ---- The STANDALONE iMessage app (its own App Store record) -------------
  # A codeless container for FoolishMessages.appex — an extension cannot be
  # distributed alone, so shipping the iMessage game without the host app needs
  # this. No sources: a messages application never runs its own UI.
  #
  # The whole point is what it does NOT link: FoolishKit only, so no Supabase,
  # no accounts, no backend. That is what keeps it clear of 5.1.1(v) account
  # deletion, the auth rebuild, online privacy labels, and a staging backend.
  FoolishMessagesApp:
    type: application.messages
    platform: iOS
    entitlements:
      # Its OWN group, deliberately NOT the host app's group.cards.foolish.
      # These are two independently-versioned App Store records and nothing in
      # the host app reads this store today (FoolishApp references
      # MessageGameStore zero times), so sharing would buy nothing and couple
      # two release cycles. If the host app ever needs to read Messages games,
      # it can declare BOTH groups — the entitlement is an array — so this is
      # reversible without a data migration.
      path: FoolishMessagesApp/FoolishMessagesApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cards.foolish.msg
    sources:
      - path: FoolishMessagesApp
    dependencies:
      - target: FoolishMessages
        embed: true
      # MUST be embedded here even though this container has no code: the .appex
      # links @rpath/FoolishKit.framework, and @rpath for an extension resolves
      # into its CONTAINING app's Frameworks/. Without this the bundle builds
      # clean and then fails to load the extension at runtime.
      # link:false because this container has no code to link AGAINST it — it
      # only needs to CARRY the binary. (With link:true xcodegen generates no
      # phase at all for a codeless target, and the framework silently goes
      # missing from the bundle.)
      - target: FoolishKit
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.msg
        INFOPLIST_FILE: FoolishMessagesApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        # App Store validation requires the container to carry an app icon +
        # CFBundleIconName even though it is a codeless Messages-only app (no Home
        # Screen icon). Same 1024 icon as the main Foolish app
        # (FoolishMessagesApp/Assets.xcassets/AppIcon, copied from FoolishApp).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---- The iMessage extension (M1) ---------------------------------------
  # An iMessage game has no server: the whole game is the MSMessage URL, so this
  # target needs no network stack — only FoolishKit's engine and components.
  FoolishMessages:
    type: app-extension.messages
    platform: iOS
    entitlements:
      # Declared here as `properties` so `xcodegen generate` REGENERATES the
      # App Group into the file instead of blanking it (the host app's
      # entitlements need a git-checkout after every run; this one does not).
      # The group is where the seat cache + preferred chain live (§9.3): the
      # extension has no database and no background time, so its only durable
      # store is this group. It must match FoolishAppGroup in this target's
      # Info.plist, which is what MessageGameStore reads at runtime.
      path: FoolishMessages/FoolishMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cards.foolish.msg
    sources:
      - path: FoolishMessages
    dependencies:
      - target: FoolishKit
    settings:
      base:
        # Prefixed by its CONTAINER (FoolishMessagesApp), not the host app — an
        # extension's bundle id must extend the app that embeds it. The old
        # cards.foolish.app.MessagesExtension id stays registered in the portal
        # for the day the host app embeds a copy again.
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.msg.MessagesExtension
        INFOPLIST_FILE: FoolishMessages/Info.plist
        # The Messages drawer shows a WIDE (4:3) icon, a different asset from the
        # host app's square AppIcon — a Messages extension without it is rejected
        # at upload. The set is the jester-Д cropped to 4:3 (FoolishMessages/
        # Assets.xcassets/iMessage App Icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        # The extension's memory ceiling is the reason this target stays thin:
        # SwiftUI + libfoolish only — no wasm, no WKWebView, no bots, no Oracle
        # (§17.5).
        TARGETED_DEVICE_FAMILY: "1"

  # ---- watchOS companion (docs/WATCHOS_APP_PLAN.md) ----------------------
  # W1 SCAFFOLD ONLY. Reserves the target + its registered bundle id
  # (cards.foolish.app.watchkitapp), buildable on the watch simulator, so the
  # app record and signing have a home. Deliberately standalone:
  #   - does NOT depend on FoolishKit yet: FoolishKit has no watchOS destination
  #     and vendor/Foolish.xcframework has no watchOS slice (that is the next
  #     watch step). Adding a broken cross-platform link here would fail the
  #     build, so the dependency is omitted until the engine is ported.
  #   - is NOT embedded in the host Foolish app yet, so the iOS app + iMessage
  #     extension builds are entirely unaffected. To BUNDLE it later, add
  #     `- target: WatchFoolish` (embed: true) to Foolish's dependencies.
  # Independent-capable via WKRunsIndependentlyOfCompanionApp (WatchUI/Info.plist).
  WatchFoolish:
    type: application
    platform: watchOS
    sources:
      - path: WatchUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.app.watchkitapp
        INFOPLIST_FILE: WatchUI/Info.plist
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"     # watchOS
        # YES so Xcode injects CFBundleIdentifier/Executable/version keys; the
        # WK* keys still come from INFOPLIST_FILE (merged). NO left the bundle
        # without an id, so the watch sim refused to install it.
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "12"
        # The circular watch icon (WatchUI/Assets.xcassets/AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---- Headless harness tests (drive HarnessModel with NO UI) ------------
  # Hosted by FoolishHarness so `@testable import FoolishHarness` can reach the
  # internal HarnessModel state machine (the part that carried the B4 "damaged"
  # bug). xcodegen auto-wires TEST_HOST/BUNDLE_LOADER from the app dependency.
  # These never ship — they exist to run a whole iMessage game through the
  # harness model without a simulator tap. See HarnessTests/.
  HarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessTests
    dependencies:
      - target: FoolishHarness
      - target: FoolishKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.harnesstests
        GENERATE_INFOPLIST_FILE: "YES"

  # ---- Shared framework: Engine + DesignSystem + Boards + Messages + Entitlements
  # Extension-safe by construction: no network stack, no Supabase, no app-only
  # API. Both shipping products link this — it is the shared UI + engine layer.
  # Anything that talks to a server belongs in FoolishNet, not here.
  FoolishKit:
    type: framework
    platform: iOS
    sources:
      - path: FoolishKit
      # The Swift kernel binding lives in the unified SDK home (A10):
      # repo-root sdk/swift/ (EngineC.swift + models), sibling to sdk/ts and
      # c. It is still compiled INTO the FoolishKit module — a source
      # location change, not a module split — so app/extension access is
      # unchanged.
      - path: ../sdk/swift
      - path: Entitlements
    dependencies:
      # The C engine, built by `make ios-lib` in ../c. Static (embed:false).
      - framework: vendor/Foolish.xcframework
        embed: false
    # THE KERNEL STALENESS GUARD.
    #
    # FoolishKit links a PREBUILT static library, so a change to the C kernel
    # reaches the app only after `make ios-lib`. Nothing used to say so: the app
    # kept linking the old library, the C's own tests kept passing (they compile
    # the real sources), and the Swift tests kept passing too — so a kernel fix
    # could be "verified" twice over and still not be in the product. That is
    # exactly what happened to Rule P's phase rule: shipped, tested, absent, and
    # the group-chat lobby fork it was meant to close carried on.
    #
    # This turns that silence into a build failure naming the command. It only
    # stats files, so it costs nothing on a normal build.
    preBuildScripts:
      - name: Kernel freshness (vendor/Foolish.xcframework vs c/)
        basedOnDependencyAnalysis: false
        script: |
          FW="$SRCROOT/vendor/Foolish.xcframework"
          C="$SRCROOT/../c"
          if [ ! -d "$FW" ]; then
            echo "error: vendor/Foolish.xcframework is missing. Run: cd c && make ios-lib"
            exit 1
          fi
          STALE=$(find "$C/src" "$C/ios" \( -name '*.c' -o -name '*.h' \) \
                    -newer "$FW/Info.plist" -print -quit 2>/dev/null)
          if [ -n "$STALE" ]; then
            echo "error: the C kernel changed after the linked library was built"
            echo "error: (e.g. $STALE). The app would link a STALE kernel."
            echo "error: Run: cd c && make ios-lib"
            exit 1
          fi
      # NOTE: no Supabase here. The network stack lives in FoolishNet, which the
      # iMessage extension never links — see that target's comment.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.kit
        DEFINES_MODULE: "YES"
        # Without this the framework ships with no Info.plist and the app's
        # embed phase refuses it ("did not contain an Info.plist"). The app
        # target points at a checked-in plist; the framework has none, so Xcode
        # has to synthesize one.
        GENERATE_INFOPLIST_FILE: "YES"
        # APPLICATION_EXTENSION_API_ONLY: FoolishKit is linked by the iMessage
        # extension (FoolishMessages), which is extension-only, so the framework
        # must be too. An audit found FoolishKit + sdk/swift use NO app-only API
        # (the only app-only call, ShareLink, is in the app target where it
        # belongs), so this is now ON and the compiler keeps it that way — an
        # app-only API creeping into FoolishKit becomes a build error, not a
        # runtime surprise in the extension. (Separate, heavier concern tracked
        # apart: FoolishKit still links the Supabase SDK, so the extension binary
        # carries a network stack it never uses — §17.5's memory ceiling wants a
        # FoolishKitCore/Net split; that is a refactor, not this flag.)
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # ---- Online-only framework: Supabase, auth, edge functions, realtime ----
  # Split out of FoolishKit so the iMessage extension stops linking a network
  # stack it never uses (§17.5's memory ceiling). The extension's memory limit
  # is undocumented by Apple and determined experimentally, so the cheapest
  # insurance is not carrying the SDK at all.
  #
  # This is also what lets the iMessage app ship as its own product: the
  # standalone target links FoolishKit only, so it inherits no account system,
  # no backend dependency, and none of the host app's compliance surface.
  #
  # APPLICATION_EXTENSION_API_ONLY is deliberately OFF here (the default): this
  # framework is app-only, and leaving the flag off is what keeps app-only API
  # from creeping back into FoolishKit, where it WOULD break the extension.
  FoolishNet:
    type: framework
    platform: iOS
    sources:
      - path: FoolishNet
    dependencies:
      - target: FoolishKit
      # Online play (§16.D): auth, edge functions, realtime.
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.net
        DEFINES_MODULE: "YES"
        GENERATE_INFOPLIST_FILE: "YES"

  # ---- Unit + snapshot + golden tests ------------------------------------
  FoolishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoolishTests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: Foolish
      - target: FoolishKit
      - target: FoolishNet
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.tests
        # With signing enabled at the project base (Milestone F), even the test
        # bundle gets signed and therefore needs an Info.plist. Generate one
        # (FoolishKit does the same) — without it `xcodebuild test` fails to sign.
        GENERATE_INFOPLIST_FILE: "YES"

  # ---- FoolishHarness (DEV TEST HOST — NEVER SHIPPED) --------------------
  # A normal iOS app that renders the SAME MessagesRootView the iMessage
  # extension renders, driven by a fake 2-8 "participant" transcript. It exists
  # ONLY to test N-way group logic + UI on one simulator: Apple's Messages host
  # cannot be extended past its two seeded participants, and two simulators
  # cannot iMessage each other, so the shipping path can't exercise a 3-8 player
  # game locally. This target is NOT embedded in Foolish, is NOT an app-extension,
  # and must never ship. See ios/HarnessUI/ and docs/IMESSAGE_MAC_RUNBOOK.md.
  FoolishHarness:
    type: application
    platform: iOS
    sources:
      - path: HarnessUI
    dependencies:
      - target: FoolishKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.foolish.harness
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Foolish:
    build:
      targets:
        Foolish: all
        FoolishKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoolishTests
  # The standalone iMessage app. Run this scheme to launch Messages in the
  # simulator with the extension installed (docs/IMESSAGE_MAC_RUNBOOK.md Part 3).
  FoolishMessagesApp:
    build:
      targets:
        FoolishMessagesApp: all
        FoolishMessages: all
        FoolishKit: all
    run:
      config: Debug

  # Runs the headless harness game-loop tests (no simulator UI needed).
  FoolishHarness:
    build:
      targets:
        FoolishHarness: all
        HarnessTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarnessTests
