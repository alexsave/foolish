# utils.foolish.cards: a static site built in the sibling repository foolish-utils, deployed by
# ./cbase (cbase/tools/cbase in this repository). The static dir is read relative to the working
# directory, so run it from the foolish-utils checkout, after its npm run build:
#   cd ../foolish-utils && ../foolish/cbase/tools/cbase -f ../foolish/utils/cbase.conf deploy
CBASE_APP = utils
CBASE_VM = none
# The one static group (bucket) foolish and uttt use too, in the folder utils/.
CBASE_STATIC = foolish
CBASE_STATIC_DIR = out
CBASE_DOMAIN = utils.foolish.cards
