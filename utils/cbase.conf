# utils.foolish.cards: a static site built in the sibling repository foolish-utils, deployed by
# ./cbase (cbase/tools/cbase in this repository), adopting the live web bucket and certificate.
# The static dir is read relative to the working directory, so run it from the foolish-utils
# checkout, after its npm run build:
#   cd ../foolish-utils && ../foolish/cbase/tools/cbase -f ../foolish/utils/cbase.conf deploy
CBASE_APP = utils
CBASE_VM = none
# The live web bucket's utils/ folder.
CBASE_STATIC_BUCKET = cbase-web-487337210065
CBASE_STATIC_PREFIX = utils
CBASE_STATIC_DIR = out
CBASE_DOMAIN = utils.foolish.cards
# The foolish.cards certificate, which names utils.foolish.cards.
CBASE_CERT_ARN = arn:aws:acm:us-east-1:487337210065:certificate/42ecb64e-bf84-4372-9170-2e645119b12f
