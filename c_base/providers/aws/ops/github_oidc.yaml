AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GitHub Actions deploys for c_base: the account's GitHub OIDC provider and the
  one role .github/workflows/c_base.yml and web_aws.yml assume from main.

# The stack `cbase-github`, deployed by hand from this Mac (c_base/RUNBOOK.md,
# "GitHub deploys"):
#
#   aws cloudformation deploy --region us-east-1 --stack-name cbase-github \
#     --template-file c_base/providers/aws/ops/github_oidc.yaml --capabilities CAPABILITY_NAMED_IAM
#
# Its DeployRoleArn output is the repository secret CBASE_AWS_ROLE_ARN, which
# both deploy workflows read. One role, one owner: cbase.yaml and web.yaml
# carry no GitHub resources.
#
# What the role may do, and nothing else:
#   * the API server: upload a `cbase serve` binary under the code bucket's
#     vm/ prefix, point /cbase-vm/release/serve at it, and run a shell command
#     on the cbase-vm group's instance through SSM (its boot script, which
#     fetches, checks and restarts; then the health checks) and read the result
#     (c_base/providers/local/ops/vm_release.sh; role_covers_release.sh holds
#     the script's calls to this list). It reads and writes no other parameter
#     (the VM's secrets are SecureStrings under /cbase-vm/env/, out of reach);
#   * the web: upload to and delete from the web bucket, invalidate the two
#     distributions, and update the cbase-web stack's page-list parameters on
#     its previous template, which republishes the two router Functions
#     (c_base/providers/aws/ops/site/web_deploy.sh site);
#   * read the web stack.
# It cannot change a template: UpdateStack is allowed on cbase-web, but
# CloudFormation would need IAM, S3 bucket and CloudFront distribution rights to
# apply any template change, and the role has none of them. A template change
# is deployed by hand (local/ops/vm_deploy.sh, aws/ops/site/web_deploy.sh stack).
#
# Until 2026-10-19 the role also shipped the Lambda (lambda_deploy.sh: the zip,
# the cbase stack's CodeKey, and the reads CloudFormation re-resolves). Those
# rights were removed when the VM took production's traffic and the Lambda was
# frozen at reserved concurrency 0; a Lambda rollback is lambda_deploy.sh by
# hand with an operator's credentials (c_base/RUNBOOK.md).

Parameters:
  GitHubRepo:
    Type: String
    Default: alexsave/foolish
    Description: owner/name of the only repository the role trusts.
  ExtraSubject:
    Type: String
    Default: ""
    Description: >-
      One more OIDC subject to trust, for proving a workflow change from its
      branch before it reaches main (repo:owner/name:ref:refs/heads/<branch>).
      Leave empty: set it for the proof, then redeploy with it empty.
  CodeBucket:
    Type: String
    Default: cbase-code-487337210065-us-east-1
  VmGroup:
    Type: String
    Default: cbase-vm
    Description: the cbase-vm auto-scaling group, whose instance the role may run commands on.
  WebStack:
    Type: String
    Default: cbase-web
  WebBucket:
    Type: String
    Default: cbase-web-487337210065
  FoolishDistributionId:
    Type: String
    Default: E1YC4MJXHIOBQD
  UtttDistributionId:
    Type: String
    Default: E1PSTHCGSF35HM

Conditions:
  HasExtra: !Not [!Equals [!Ref ExtraSubject, ""]]

Resources:
  # An account holds one provider for this URL; this stack is its owner.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbase-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !If
                  - HasExtra
                  - [!Sub "repo:${GitHubRepo}:ref:refs/heads/main", !Ref ExtraSubject]
                  - [!Sub "repo:${GitHubRepo}:ref:refs/heads/main"]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${WebStack}/*"
              - Sid: UpdateStacks
                Effect: Allow
                Action: cloudformation:UpdateStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${WebStack}/*"

              # ---- the API server (cbase-vm) ----
              - Sid: VmRelease
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/vm/cbase-serve-*"
              - Sid: VmReleasePointer
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cbase-vm/release/serve"
              # SendCommand authorizes the document and each instance: the
              # instance only when it carries the group's tag (Auto Scaling
              # tags every instance it launches with aws:autoscaling:groupName).
              - Sid: VmCommandDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: VmCommandInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ssm:resourceTag/aws:autoscaling:groupName": !Ref VmGroup
              # Neither has a resource type: Resource "*" is the only form.
              - Sid: VmCommandResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - autoscaling:DescribeAutoScalingGroups
                Resource: "*"

              # ---- the web ----
              - Sid: WebFiles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucket}/*"
              - Sid: WebList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucket}"
              - Sid: Invalidate
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FoolishDistributionId}"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${UtttDistributionId}"
              # What CloudFormation calls, as this role, to apply new page lists.
              - Sid: Routers
                Effect: Allow
                Action:
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/${WebStack}-foolish-router"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/${WebStack}-uttt-router"

Outputs:
  DeployRoleArn:
    Description: The repository secret CBASE_AWS_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Value: !Ref GitHubOidcProvider
