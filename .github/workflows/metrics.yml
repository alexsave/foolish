name: metrics

# Surfaces the repo's health numbers ON THE PR, before vs after, instead of
# leaving them buried in gate logs: engine speed, wasm size and declared memory,
# and the web bundle. (The thinking-bot move latency against Postgres went with
# the TypeScript server in stage 4; the server's latency is c_base's
# `cbase-bench roundtrip`.)
#
# It runs scripts/collect_metrics.mjs on BOTH the PR head and its base (the new
# measurement files are copied into the base checkout so only the SOURCE
# differs), then posts/updates one sticky comment with the deltas. Informational
# only - the pass/fail gates stay in coverage.yml / memory.yml / validate.yml.

on:
  pull_request:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/metrics.yml'

# Least privilege: read the code, write the one sticky PR comment.
permissions:
  contents: read
  pull-requests: write

# A newer push supersedes an in-flight metrics run for the same PR.
concurrency:
  group: metrics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest

    env:
      BENCH_GAMES: '300'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          path: pr

      - name: Checkout base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # A BASE THAT PREDATES THE MOVE INTO foolish/ keeps the product at its
      # root; the same "the base branch may predate them" shape as the two
      # guards below, resolved once here for every later step.
      - name: Find the base's product root
        run: |
          if [ -d base/foolish ]; then echo "BASE_DIR=base/foolish"; else echo "BASE_DIR=base"; fi >> "$GITHUB_ENV"

      # Measure both sides with the SAME collector/bench (the base branch may
      # predate them) - only the measured SOURCE differs.
      - name: Sync measurement scripts into base
        run: |
          mkdir -p "$BASE_DIR/scripts" "$BASE_DIR/e2e"
          cp pr/foolish/scripts/collect_metrics.mjs "$BASE_DIR/scripts/collect_metrics.mjs"
          cp pr/foolish/scripts/render_metrics.cjs  "$BASE_DIR/scripts/render_metrics.cjs"
          cp pr/foolish/scripts/measure_web_bundle.mjs "$BASE_DIR/scripts/measure_web_bundle.mjs"

      - name: Install deps (head)
        working-directory: pr/foolish
        run: npm install

      - name: Install deps (base)
        working-directory: ${{ env.BASE_DIR }}
        run: npm install

      # BOTH CHECKOUTS, and by hand rather than through the `premetrics` hook:
      # the steps below run `node scripts/collect_metrics.mjs` directly, so npm
      # never sees the script name and never runs its pre-hook. The collector
      # shells into `next build` and the e2e benches, which compile sdk/ts/gen.
      # Each side generates from ITS OWN headers - that is the whole point of
      # measuring two commits - so this cannot be done once and shared.
      - name: Generated modules (both sides)
        run: |
          # SOURCED, not run: a step exports to LATER steps through GITHUB_ENV,
          # so within this one the toolchain has to land in this shell.
          . pr/shared/scripts/ci_llvm.sh
          bash pr/foolish/tools/structgen/gen.sh
          bash "$BASE_DIR/tools/structgen/gen.sh"

      # THE SHIPPED WASM MODULES, both sides, for the same reason and with the
      # same caveat. collect_metrics.mjs reports each one's gzip size and reads
      # web.wasm's linear memory, so an unbuilt side measures nothing - and
      # since the gzip size is no longer asserted by a test (the compressor moves
      # it by up to 576 B on identical input, see e2e/mem/wasm_memory.test.ts),
      # THIS is now where a download-size regression gets noticed. It is the
      # instrument, so it has to have something to measure.
      #
      # A BASE THAT PREDATES THE CUTOVER still has the three .gz committed and no
      # builder to run, which is the same "the base branch may predate them"
      # shape as the sync step above.
      - name: Shipped wasm modules (both sides)
        run: |
          bash pr/foolish/scripts/wasm_build.sh
          if [ -f "$BASE_DIR/scripts/wasm_build.sh" ]; then
            bash "$BASE_DIR/scripts/wasm_build.sh"
          else
            echo "base predates scripts/wasm_build.sh - its modules are committed there"
          fi

      - name: Collect base metrics
        working-directory: ${{ env.BASE_DIR }}
        run: node scripts/collect_metrics.mjs > "$GITHUB_WORKSPACE/base.json"

      - name: Collect head metrics
        working-directory: pr/foolish
        run: node scripts/collect_metrics.mjs > "$GITHUB_WORKSPACE/head.json"

      - name: Upsert metrics comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { render, MARKER, extractSlot, spliceSlot } = require(`${process.env.GITHUB_WORKSPACE}/pr/foolish/scripts/render_metrics.cjs`);
            const base = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/base.json`, 'utf8'));
            const head = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/head.json`, 'utf8'));
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            let body = render(base, head);
            if (existing) {
              // The coverage job co-owns this comment (it fills the coverage slot
              // ~minutes later). Preserve whatever it already wrote so a metrics
              // re-render never wipes it.
              const cov = extractSlot(existing.body || '');
              if (cov) body = spliceSlot(body, cov);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Job summary (also viewable on the check)
        if: always()
        run: |
          {
            echo "### Metrics collected"
            echo '```json'
            cat "$GITHUB_WORKSPACE/head.json" 2>/dev/null || echo "head metrics missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
