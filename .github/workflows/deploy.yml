name: deploy

# Ships the Supabase backend on every merge to main: applies any pending schema
# change, then deploys the edge functions. The schema change runs FIRST so it is
# in place before the new function code that depends on it (the
# expand-then-deploy order; an additive change keeps the currently-live
# functions working during the window).
#
# server/impls/supabase/seed.sql is the schema, and every database but hosted is
# built from it. Hosted is the one database that cannot be - seed.sql drops every
# table it finds - so a change reaches it as a delta through
# server/impls/supabase/migrations/, whose README has the rule.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the project's database password (used by
#                            `supabase link` / `db push` non-interactively)
# The project ref is public (it's in the project URL), so it lives inline below.

on:
  push:
    branches: [main]
    # EVERY PATH THE DEPLOYED SERVER IS BUILT FROM, not just the one it lives in.
    # A missing path here does not fail anything: it merges, deploys nothing, and
    # the server stays on the old code until some unrelated push happens to touch
    # a path that IS listed. That has already happened once (see 'supabase/**'
    # below) and it went unnoticed for weeks.
    #
    # `e2e/validation/deploy_paths_validation.test.ts` walks the functions' real
    # import graph and fails if anything it reaches is not covered here, so this
    # list is checked rather than remembered. Do not prune an entry because it
    # "looks unrelated" - that test says what is related.
    paths:
      # The backend moved to server/impls/supabase (A10). The old 'supabase/**'
      # is anchored at the repo root, so after the move it matched NOTHING and
      # pushes silently stopped triggering deploys — the server went stale.
      - 'server/impls/supabase/**'
      # The functions resolve @sdk/ and @api/ (functions/<name>/deno.json) and
      # import real code through them: the wire codecs and the wasm bindings out
      # of sdk/ts, and the whole host-neutral game layer out of server/api. That
      # code is COMPILED INTO the deployed functions, so a change to it is a
      # change to the server. Both roots are listed whole rather than by
      # subdirectory because every subtree under them is on the graph today
      # (sdk/ts is wasm/ + wire/; server/api is core/ + common/), and a new
      # sibling is far likelier to be a dependency than not.
      #
      # The cost is deploys that change nothing in the functions. That is the
      # cheap direction: `db push` + `functions deploy` are idempotent, while a
      # missed deploy is a server running code nobody merged.
      - 'sdk/ts/**'
      - 'server/api/**'
      # bots.wasm.gz used to be listed here explicitly, because it is not
      # imported but BUNDLED as a static asset (config.toml static_files) and a
      # kernel rebuild alone had to redeploy. It is a build output now, so that
      # entry could never fire again - nothing commits it - and what actually
      # has to trigger a deploy is the C it is built FROM. That is 'c/src/**'
      # and the shared entries below, which are already here for sdk/ts/gen and
      # now carry this too.
      #
      # THE SOURCES OF sdk/ts/gen, which the import graph cannot see. The
      # functions import those modules and this workflow generates them from the
      # C headers before bundling, so a header or a spec change is a change to
      # the deployed code - but the modules are build outputs now, so no file
      # under 'sdk/ts/**' moves when a header does. Without these two lines a
      # layout change would merge, deploy nothing, and leave the server reading
      # the kernel at last week's offsets.
      #
      # deploy_paths_validation.test.ts walks the import graph and cannot reach
      # a generator through a generated file, so these are the one pair of
      # entries in this list that the test does not derive. That is what the
      # comment is for.
      - 'c/src/**'
      - 'tools/structgen/**'
      # AND THE SHARED HALF OF BOTH, because this repo holds two products now.
      # The generator, its libclang driver (llvm.mk) and datagen live in
      # shared/tools; sha256.h and deal_rng.h - which the layout is computed
      # THROUGH, since game.h and msg_wire.h include them - live in shared/c.
      # Neither is under a path above any more.
      #
      # This is the same failure as the 'supabase/**' one at the top of this
      # list, and a monorepo makes it likelier, not less: a path filter that
      # matches nothing is indistinguishable from one that matches nothing
      # RELEVANT. deploy_paths_validation.test.ts now asserts every entry here
      # names something that exists, so a move cannot leave a dead glob behind.
      - 'shared/c/**'
      - 'shared/tools/**'
  workflow_dispatch: {}

# Never let two deploys race; queue instead of cancelling a push mid-flight.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wngpfwmwkltonwosqflx

    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: `latest` makes an unauthenticated GitHub API call
      # on every run to resolve the newest release, which rate-limits (the
      # `memory` workflow failed on main with "Failed to resolve latest Supabase
      # CLI release: rate limit exceeded") and silently changes the tooling under
      # us. A fixed version is downloaded straight from the release URL with no
      # API call at all. 2.116.0 is what `latest` resolved to when this was
      # pinned, so the pin is behaviourally a no-op.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # The functions import sdk/ts/gen through their @sdk/ alias
      # (functions/<name>/deno.json), and `functions deploy` COMPILES that code
      # into the bundle it ships. Those modules are written by tools/structgen
      # from the C headers, so they are generated here, from this commit, before
      # anything is bundled - the deployed server reads the kernel's memory at
      # the offsets this tree's headers describe, or it reads them at somebody
      # else's.
      - name: Generated modules (the functions compile them in)
        run: |
          # SOURCED, not run: a step exports to LATER steps through GITHUB_ENV,
          # so within this one the toolchain has to land in this shell.
          . scripts/ci_llvm.sh
          bash tools/structgen/gen.sh

      # …AND THE KERNEL ITSELF, which this lane did not have to do while
      # bots.wasm.gz was committed and `functions deploy` just shipped whatever
      # came out of git. It is a build output now, so THIS is the step that
      # decides what the five edge functions carry as their static asset
      # (server/impls/supabase/config.toml static_files). Without it the deploy
      # would ship a function whose kernel is missing, not a stale one.
      #
      # bots only: no edge function loads an Oracle module, and the two of them
      # cost ~13s to compile (scripts/wasm_build.sh's header has the numbers).
      - name: The kernel the functions ship as a static asset
        run: bash scripts/wasm_build.sh bots

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --workdir server/impls

      # NORMALLY A NO-OP, AND THAT IS THE POINT. seed.sql is the schema now, and
      # server/impls/supabase/migrations/ is empty: a merge to main runs no SQL
      # against the hosted database at all and goes straight to the functions.
      #
      # On the day somebody does add a delta there (its README has the rule),
      # this step applies it before the functions that depend on it deploy. One
      # thing has to happen first, once, by hand: hosted's history table still
      # records the 39 versions whose files this commit deleted, and
      # `supabase db push` REFUSES to run while a remote version has no local
      # file - "LegacyDbPushMissingLocalError: Remote migration versions not
      # found in local migrations directory", measured against a real Postgres
      # carrying those rows, with the local directory both empty and absent. The
      # one-time command that clears them is in the README. It is bookkeeping
      # (it DELETEs rows from the history table and touches no schema), it can
      # never be needed twice, and it is deliberately not here: nothing that
      # touches hosted belongs on the merge path.
      - name: Apply pending schema changes, if there are any
        run: |
          if ls server/impls/supabase/migrations/*.sql >/dev/null 2>&1; then
            supabase db push --linked --yes --workdir server/impls
          else
            echo "server/impls/supabase/migrations/ holds no .sql file: this deploy runs no SQL against the hosted database."
          fi

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --workdir server/impls
