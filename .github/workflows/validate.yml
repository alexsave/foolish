name: validate

# Fast regression validation: small, deterministic, handpicked scenarios that
# guard the bugs behind every e2e suite — NOT the full fuzzers. Each scenario
# LIVES in its domain test file (e.g. pass cases in e2e/pass_parity.test.ts,
# alongside the fuzzer) and is exported as register*Validation(); the thin
# runners in e2e/validation/ import and execute them with VALIDATION_ONLY=1 so
# importing a domain file does not register its heavy/fuzzer tests.
#   validation/pass_parity_validation - client/server agreement on pass legality
#   validation/client_validation      - reconcile gate+merge, rendered hand, optimistic dedup
#   validation/client_rules_validation - next-defender rotation + keyboard pass parity (hand-rolled-logic fixes)
#   validation/replay_validation      - replay codec round-trip (engine<->replay drift) + timing
# The cover / rearrange / adversarial-attack cases are C now (c/tests/tests.c,
# run by coverage.yml's c-engine job).
# The exhaustive fuzzers remain for local / on-demand deep runs via `npm run test:e2e`.

on:
  push:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/validate.yml'

# Every step runs from foolish/, where these commands have always run. Only the
# path globs and the `uses:`/`working-directory:` inputs are from the repo root.
defaults:
  run:
    working-directory: foolish

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # `cache: npm` caches ~/.npm, the download cache, keyed on
          # package-lock.json. It changes nothing about what `npm install`
          # RESOLVES - the lockfile still decides that - so it cannot hand two
          # lanes of one commit different dependencies, and on a miss the
          # install is exactly today's. Nine jobs a push install this same
          # tree from this same lockfile; only the fetching is shared.
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      # BEFORE the type-check, not after. tools/structgen writes the modules
      # sdk/, src/, server/ and e2e/ import, and it runs as a pre-hook of every
      # npm script that compiles or loads them (package.json "//gen"), so the
      # compiler has to be here before the first of those - `npm run typecheck`,
      # two steps down. The wasm build below re-uses what this installs.
      - name: Toolchain (libclang, for the generated modules)
        run: bash ../shared/scripts/ci_llvm.sh

      # No Math.random() in e2e/, sdk/ or server/. The invariant it guards: one
      # crypto draw per game, at the deal; everything after it derives from that
      # seed. It runs first and fails in seconds.
      - name: Determinism gate (no Math.random in the game path)
        run: npm run check:determinism

      # Both TypeScript projects: the web (tsconfig.json) and every e2e suite,
      # helper and script with the server and SDK modules they reach
      # (e2e/tsconfig.json).
      - name: Type-check (web and e2e)
        run: npm run typecheck

      # The TEST bots module (the whole kernel, every export; it ships nowhere) is never
      # committed, and the scenarios below load it through
      # e2e/helpers/bots_test_wasm.ts, which builds it on demand. That build runs
      # tools/structgen, so it needs libclang - which this lane did not install,
      # and every scenario that touches a board failed on clang-c/Index.h until
      # this step was added. The script installs the toolchain, builds once, and
      # exports WASM_CC/LLVM_PREFIX for the suite.
      - name: Build the test bots module
        run: bash scripts/ci_bots_test_wasm.sh

      - name: Run validation suite (handpicked regression scenarios)
        run: npm run test:validate
