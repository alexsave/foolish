name: validate

# Fast regression validation: small, deterministic, handpicked scenarios that
# guard the bugs behind every e2e suite — NOT the full fuzzers. Each scenario
# LIVES in its domain test file (e.g. pass cases in e2e/pass_parity.test.ts,
# alongside the fuzzer) and is exported as register*Validation(); the thin
# runners in e2e/validation/ import and execute them with VALIDATION_ONLY=1 so
# importing a domain file does not register its heavy/fuzzer tests.
#   validation/pass_parity_validation - client/server agreement on pass legality
#   validation/handlers_validation    - cover / rearrange / adversarial-attack rejection
#   validation/client_validation      - reconcile gate+merge, rendered hand, optimistic dedup
#   validation/client_rules_validation - next-defender rotation + keyboard pass parity (hand-rolled-logic fixes)
#   validation/replay_validation      - replay codec round-trip (engine<->replay drift) + timing
#   validation/db_validation          - CAS conservation + version monotonicity, lease, meta, isolation
# The exhaustive fuzzers remain for local / on-demand deep runs via `npm run test:e2e`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    # db_validation.test.ts exercises the real CAS commit / bot-lease plpgsql / meta
    # endpoint. The harness connects with these defaults (e2e/adapters/supabase.ts):
    # host 127.0.0.1, user/password/db = stress/stress/foolish. The postgres image's
    # POSTGRES_USER is a superuser, which the schema/seed need.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: foolish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stress -d foolish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_PGHOST: 127.0.0.1
      E2E_PGPORT: 5432
      E2E_PGUSER: stress
      E2E_PGPASSWORD: stress
      E2E_PGDATABASE: foolish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run validation suite (handpicked regression scenarios)
        run: npm run test:validate
