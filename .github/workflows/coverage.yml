name: coverage

# Code-quality gate: fails the build if test coverage of the game's core logic
# regresses below a floor. Three scopes, each measured against the committed
# test suites — deliberately EXCLUDING the bot-AI strategies (research code) and
# the React UI components (no DOM test harness), so the gate tracks the logic
# that must stay correct: the C rules engine and the client move rules. The
# server orchestration is C now (c_base) and is tested there; its TypeScript
# scope went with the TypeScript server in stage 4.
#
#   c-engine       game.c / legal.c / replay.c   (gcc --coverage + gcovr)
#   client-rules   src/utils/gameValidation
#
# Floors live in c/Makefile (COV_LINE_MIN/COV_BRANCH_MIN) and package.json
# (coverage:check:*). Raise them as coverage climbs; never lower to make a red
# build pass.
#
# The measured percentages are also surfaced ON THE PR: the `comment` job below
# fills the coverage slot of the metrics comment (see .github/workflows/metrics.yml)
# so a reviewer sees the actual numbers, not just a green check. Extraction is
# best-effort (never fails the build); the gate steps remain the source of truth.

on:
  push:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/coverage.yml'

# Every step runs from foolish/, where these commands have always run. Only the
# path globs and the `uses:`/`working-directory:` inputs are from the repo root.
defaults:
  run:
    working-directory: foolish

jobs:
  c-engine:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.covc.outputs.line }}
      branch: ${{ steps.covc.outputs.branch }}
    steps:
      - uses: actions/checkout@v5

      - name: Install gcovr
        run: pipx install gcovr==8.6 || pip install --break-system-packages gcovr==8.6

      - name: C engine coverage gate (game / legal / replay)
        working-directory: foolish/c
        run: make coverage

      # Re-run gcovr over the same covbuild data (already produced above) to pull
      # the numbers as JSON. Best-effort: never fails the job.
      - name: Extract C coverage numbers
        id: covc
        if: always()
        working-directory: foolish/c
        run: |
          gcovr --root . --filter 'src/game\.c' --filter 'src/legal\.c' --filter 'src/replay\.c' \
            --json-summary -o cov-summary.json || true
          node -e '
            let l = "", b = "";
            try {
              const j = require("./cov-summary.json");
              l = j.line_percent ?? (j.line_total ? 100 * j.line_covered / j.line_total : "");
              b = j.branch_percent ?? (j.branch_total ? 100 * j.branch_covered / j.branch_total : "");
            } catch (e) {}
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `line=${l}\nbranch=${b}\n`);
          '

  # The volume the coverage corpus leaves out (c/Makefile COVERAGE_CORPUS):
  # whole octogen and robusta games, thread agreement over Monte-Carlo worlds,
  # twenty games a player count - every assertion the c-engine job no longer
  # makes at volume, made here at the flags the product ships, uninstrumented.
  # Before the split both ran in c-engine, instrumented, one after another.
  #
  # It is also the regression guard for a miscompile only these flags show:
  # the solvers once cast their move scratch to LegalMoves *, and gcc 13 at the
  # analyser's -O3 -flto acted on the strict-aliasing violation (analyse_test's
  # endgame proof came back unresolved; -O0 coverage never saw it). Pinned to
  # ubuntu-24.04 so the compiler that caught it stays the one that runs.
  c-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: C kernel suites at volume (tests, msg_wire_test 20, analyse_test)
        working-directory: foolish/c
        run: make -j"$(nproc)" volume

  server-client-ts:
    runs-on: ubuntu-latest
    outputs:
      client_line: ${{ steps.covts.outputs.client_line }}
      client_branch: ${{ steps.covts.outputs.client_branch }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24, not 20: e2e/wasm_asset_doors spawns a real ESM child with
          # --experimental-strip-types (Node 22+), and Node 20's older ESM loader
          # hooks don't resolve tsx's dynamic-import() @sdk/@api aliases (they work
          # on 24 — verified locally). Both are test-runtime limits, not code bugs.
          node-version: 24
          # `cache: npm` caches ~/.npm, the download cache, keyed on
          # package-lock.json. It changes nothing about what `npm install`
          # RESOLVES - the lockfile still decides that - so it cannot hand two
          # lanes of one commit different dependencies, and on a miss the
          # install is exactly today's. Nine jobs a push install this same
          # tree from this same lockfile; only the fetching is shared.
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      # coverage:e2e runs the full e2e suite EXCEPT lobby_add_bot.test.ts — a
      # jsdom React-render test with act()/microtask-flush timing that is flaky
      # headless in CI. It only exercises the un-gated Lobby.tsx (the gate scopes
      # is the client move rules), so excluding it
      # keeps the gate stable without affecting the measured thresholds.
      # The toolchain (libclang for tools/structgen, the pinned clang and
      # binaryen for the wasm modules): every npm lane generates sdk/ts/gen in a
      # pre-hook, and the suites start the native table host
      # (e2e/helpers/table_host.ts), whose build computes its layout hash with
      # structgen.
      - name: Toolchain (libclang, clang, binaryen)
        run: bash ../shared/scripts/ci_llvm.sh

      - name: Run e2e suite under V8 coverage
        run: npm run coverage:e2e

      - name: Client coverage gate
        run: npm run coverage:check

      # Re-report the SAME .v8cov data as json-summary to pull the numbers.
      # Best-effort: never fails the job (the gate above already decided pass/fail).
      - name: Extract TS coverage numbers
        id: covts
        if: always()
        run: |
          npm run coverage:json:client || true
          node -e '
            const rd = (p) => { try { return require(p).total; } catch (e) { return null; } };
            const c = rd("./.covjson/client/coverage-summary.json");
            const lines = [
              ["client_line", c?.lines?.pct ?? ""],
              ["client_branch", c?.branches?.pct ?? ""],
            ].map(([k, v]) => `${k}=${v}`).join("\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, lines + "\n");
          '

  # Fill the coverage slot of the metrics comment. Runs even if a gate failed
  # (always()) so a red ❌ number still shows; PR-only (nothing to comment on a push).
  comment:
    needs: [c-engine, server-client-ts]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const { renderCoverage, spliceSlot, MARKER } = require(`${process.env.GITHUB_WORKSPACE}/foolish/scripts/render_metrics.cjs`);
            const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
            const ce = { line: num(`${{ needs.c-engine.outputs.line }}`), branch: num(`${{ needs.c-engine.outputs.branch }}`) };
            const cl = { line: num(`${{ needs.server-client-ts.outputs.client_line }}`), branch: num(`${{ needs.server-client-ts.outputs.client_branch }}`) };
            const covTable = renderCoverage({
              cEngine: ce.line != null ? ce : null,
              client: cl.line != null ? cl : null,
              floors: { cEngineLine: 90, cEngineBranch: 74, clientLine: 90, clientBranch: 82 },
            });
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: spliceSlot(existing.body, covTable) });
            } else {
              core.info('metrics comment not present yet; coverage attaches on the next metrics run');
            }
