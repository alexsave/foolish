# c_base, the foolish backend in C (c_base/DESIGN.md): built and tested on
# Linux and macOS, sanitized on Linux, packaged as the static arm64 Lambda
# zip, and on main deployed to the cbase stack (c_base/ops/lambda_deploy.sh).
#
# Paths: c_base itself, the kernel it links (foolish/c), the shared C it
# compiles (shared/c), and the compile rules and tools its Makefile includes
# (shared/tools). A change to any of them changes the deployed binary.
#
# The deploy job runs on every push to main that touches those paths, and on a
# workflow_dispatch from main (Actions > c_base > Run workflow: redeploy main
# as it is). It assumes the role c_base/ops/github_oidc.yaml makes, whose trust
# accepts only refs/heads/main of this repository, through OIDC (no keys):
#   CBASE_AWS_ROLE_ARN    repository secret, the cbase-github stack's DeployRoleArn
# The role can replace the Lambda's code (a new CodeKey on the stack's existing
# template) and nothing else; a template change is c_base/ops/deploy.sh by hand.
name: c_base

on:
  push:
    branches: [main]
    paths:
      - 'c_base/**'
      - 'foolish/c/**'
      - 'shared/c/**'
      - 'shared/tools/**'
      - '.github/workflows/c_base.yml'
  # Every pull request, a stacked one into another branch included.
  pull_request:
    paths:
      - 'c_base/**'
      - 'foolish/c/**'
      - 'shared/c/**'
      - 'shared/tools/**'
      - '.github/workflows/c_base.yml'
  workflow_dispatch: {}

# THE DEPLOY QUEUE, and its one owner. On main, one run at a time, never
# cancelled once started (a cancel can land mid-way through a CloudFormation
# update); GitHub keeps one waiting run per group and cancels an older waiting
# one when a newer push arrives, so the waiting slot always holds the newest
# commit. A run that starts deploys its own commit even if main moved on while
# it built (require_main.sh, QUEUED): the newest push's run is behind it and
# deploys next. So the newest commit of main always deploys. Pull request runs
# are cancelled by newer pushes to the same pull request; they deploy nothing.
concurrency:
  group: c_base-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: build
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests and both smoke lanes
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check

  asan:
    name: make check-asan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: unit tests and smoke under ASan + UBSan
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check-asan
      # Every checked-in fuzz input (c_base/fuzz/corpus, the reproducers of
      # every bug the fuzzers found among them) through its target once,
      # under the same sanitizers, with gcc and no libFuzzer.
      - name: the fuzz corpus as a regression test
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz-replay

  fuzz:
    name: make fuzz-smoke (libFuzzer, 30 s a target)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      - name: build every target
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz
      - name: each target for 30 s from its corpus
        run: make -C c_base fuzz-smoke FUZZ_TIME=30
      - name: the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: c_base/build/fuzz-crashes
          if-no-files-found: ignore
          retention-days: 30

  # c_base/docs/COVERAGE.md: line and branch floors, and no function that no
  # test calls (tools/cov_floor.txt names the ones allowed, with a reason).
  coverage:
    name: make coverage (floors, no function at zero)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: gcovr
        run: pipx install gcovr==8.6 || pip install --break-system-packages gcovr==8.6
      - name: the coverage build, every test, the gate
        run: make -C c_base -j"$(nproc)" coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbase-coverage
          path: |
            c_base/build/cov/report.txt
            c_base/build/cov/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  dynamo:
    name: make check-dynamo (DynamoDB Local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      # The runner image has Docker and the AWS CLI; dynamo_local.sh starts
      # amazon/dynamodb-local (pinned by digest) and makes the table from
      # ops/cbase.yaml.
      - name: DynamoDB Local
        run: c_base/ops/dynamo_local.sh > /dev/null
      - name: the store, admin and import tests and the game smoke, on DynamoDB
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check-dynamo
      - name: stop DynamoDB Local
        if: always()
        run: c_base/ops/dynamo_local.sh --stop

  ops:
    name: template and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the CloudFormation template (cfn-lint, no AWS calls)
        run: |
          python3 -m venv /tmp/cfn
          /tmp/cfn/bin/pip install -q cfn-lint==1.57.2
          /tmp/cfn/bin/cfn-lint --regions us-east-1 -- c_base/ops/cbase.yaml c_base/ops/web.yaml c_base/ops/github_oidc.yaml
      - name: the shell scripts
        run: |
          bash -n c_base/ops/package.sh c_base/tools/build_bootstrap.sh c_base/ops/dynamo_local.sh c_base/ops/web_deploy.sh c_base/ops/lambda_deploy.sh c_base/ops/require_main.sh c_base/ops/ops_env.sh c_base/ops/deploy.sh
          shellcheck -x c_base/ops/package.sh c_base/ops/dynamo_local.sh c_base/ops/web_deploy.sh c_base/ops/lambda_deploy.sh c_base/ops/require_main.sh c_base/ops/test/web_deploy_gate_test.sh c_base/ops/ops_env.sh c_base/ops/test/ops_env_test.sh c_base/ops/test/changeset_gate_test.sh
      - name: web_deploy.sh and lambda_deploy.sh refuse a tree behind main (no AWS calls)
        run: bash c_base/ops/test/web_deploy_gate_test.sh
      - name: ops_env.sh never generates a secret for a live stack (no AWS calls)
        run: bash c_base/ops/test/ops_env_test.sh
      - name: deploy.sh's replacement gate on recorded change sets (no AWS calls)
        run: bash c_base/ops/test/changeset_gate_test.sh
      - name: the web router's rules (ops/web.yaml's Function code)
        run: node --test c_base/ops/test/web_router.test.mjs

  bootstrap:
    name: make bootstrap (Lambda zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The build container is linux/arm64 (tools/build_bootstrap.sh); this
      # runner is x86, so Docker runs it under QEMU. Slower, same bytes.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: package
        run: c_base/ops/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cbase-lambda
          path: |
            c_base/build/cbase-lambda.zip
            c_base/build/cbase-lambda.zip.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: deploy to Lambda
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, asan, fuzz, dynamo, ops, bootstrap]
    runs-on: ubuntu-24.04
    # One deploy at a time, and the newest always deploys: the workflow's
    # concurrency group above. No job-level group here: a second queue would
    # order deploys by which build finished first, not by push.
    permissions:
      contents: read
      id-token: write   # the OIDC token configure-aws-credentials exchanges for the role
    env:
      AWS_REGION: us-east-1
    steps:
      - name: is the deploy secret set
        env:
          ROLE_ARN: ${{ secrets.CBASE_AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::CBASE_AWS_ROLE_ARN is not set: main did not deploy (c_base/RUNBOOK.md, GitHub deploys)."
            exit 1
          fi
      # The checkout is for lambda_deploy.sh and its main-ancestry gate.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbase-lambda
          path: c_base/build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CBASE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload, point the stack at it, smoke /health
        run: c_base/ops/lambda_deploy.sh c_base/build/cbase-lambda.zip
