# c_base, the foolish backend in C (c_base/DESIGN.md): built and tested on
# Linux and macOS, sanitized on Linux, built as the static arm64 `cbase serve`
# binary, and on main deployed, with the two static sites, by ./cbase
# (cbase/tools/cbase, the submodule at the repository's root; cbase/README.md
# "./cbase deploy tool"). This is THE deploy lane of the repository: nothing
# else deploys foolish.cards, api.foolish.cards or uttt.live.
#
# Paths: c_base itself, the kernel and server it links (foolish/c,
# foolish/server), the shared C and tools it builds with (shared/), and on a
# push also everything the deploy ships: foolish's site (foolish/**, with its
# cbase.conf), uttt's site (uttt/c, uttt/web, uttt/cbase.conf), the cbase
# submodule (its pin is the deploy tool) and web_aws.yml (its two builds are
# this run's static exports).
#
# THE DEPLOY (job `deploy`), on every push to main those paths reach, and on a
# workflow_dispatch from main (Actions > c_base > Run workflow: redeploy main
# as it is; tick dry_run for a dry run). It waits for every gate below and for
# the two static exports (the `web` job runs web_aws.yml in this same run, so
# its artifacts are this run's), then, from the checkout with its submodule:
#   foolish/  CBASE_SERVE_BIN=../c_base/dist/cbase-serve-linux-arm64 ../cbase/tools/cbase deploy
#             the server on the cbase-vm instance (SSM), out/ into the web
#             bucket's foolish/, the cbase-app-foolish stack (both distributions)
#   uttt/     ../cbase/tools/cbase deploy: web/out into uttt/, cbase-app-uttt
# and checks that api.foolish.cards/health says "ok cbase" and that
# foolish.cards and uttt.live answer 200. It never passes --accept-drift,
# --allow-downtime or --prune: a drifted stack, a change set that would replace
# a distribution or move a hostname, or a bucket replacement stops the tool,
# and the job fails with its reason.
#   LIVE OR DRY: a run deploys only when the repository variable CBASE_DEPLOY is
# `live` (Settings > Secrets and variables > Actions > Variables) and dry_run
# was not ticked; otherwise it runs `./cbase deploy --dry-run` (reads AWS,
# makes and deletes a change set, changes nothing) and says so in a warning.
# Unset the variable to stop deploys without editing this file.
#   It assumes the role c_base/providers/aws/ops/github_oidc.yaml makes, whose
# trust accepts only refs/heads/main of this repository, through OIDC (no keys):
#   CBASE_AWS_ROLE_ARN    repository secret, the cbase-github stack's DeployRoleArn
# The role can make the calls ./cbase deploy makes for foolish and uttt and
# nothing else (role_covers_deploy.sh holds the tool's calls to it); a new
# group, a first deploy or a staged attach is ./cbase by hand (CUTOVER.md).
name: c_base

on:
  push:
    branches: [main]
    paths:
      - 'c_base/**'
      - 'foolish/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'uttt/cbase.conf'
      - 'shared/**'
      - 'cbase'
      - '.github/workflows/c_base.yml'
      - '.github/workflows/web_aws.yml'
  # Every pull request, a stacked one into another branch included, that
  # touches the C this workflow builds: c_base and what it links, the product
  # fuzz targets the fuzz stage also selects (shared/fuzz and the product
  # kernels it builds from), the selector, and the deploy tool's pin. A pull
  # request that touches only a site is web_aws.yml's (its compile gates).
  pull_request:
    paths:
      - 'c_base/**'
      - 'foolish/c/**'
      - 'foolish/server/**'
      - 'shared/c/**'
      - 'shared/tools/**'
      - 'shared/fuzz/**'
      - 'pickemup/c/**'
      - 'tallybones/c/**'
      - 'chuiniu/c/**'
      - 'uttt/c/**'
      - '.github/scripts/fuzz_select.sh'
      - '.github/workflows/c_base.yml'
      # A pin bump of the deploy tool: the ops job checks the role covers its calls.
      - 'cbase'
  workflow_dispatch:
    inputs:
      dry_run:
        description: ./cbase deploy --dry-run (reads AWS, makes and deletes a change set, changes nothing)
        type: boolean
        default: false

# THE DEPLOY QUEUE, and its one owner. On main, one run at a time, never
# cancelled once started (a cancel can land mid-way through a deploy: the
# service restarted, the stack update half done); GitHub keeps one waiting run
# per group and cancels an older waiting one when a newer push arrives, so the
# waiting slot always holds the newest commit. A run that starts deploys its
# own commit even if main moved on while it built: the newest push's run is
# behind it and deploys next. So the newest commit of main always deploys, and
# two deploys never overlap. Pull request runs are cancelled by newer pushes to
# the same pull request; they deploy nothing.
concurrency:
  group: c_base-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Linux: the platform the shipped binary runs on, and what the deploy waits on.
  check:
    name: make check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: build
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests and both smoke lanes
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check
      # CBASE_IO_URING (net/loop.h): the suite again with every loop on io_uring; unit_uring's first
      # line says whether the runner allowed it (else the loops fall back to epoll, as serve's would).
      - name: unit tests and smokes with every loop on io_uring
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" test-uring

  # macOS: the same suite on the development platform, linked against Homebrew's SQLite (upstream's,
  # as on Linux and in production; Apple's system one has its own page cache, c_base/Makefile). It is
  # a check of its own, not one the deploy waits on: nothing ships for macOS. Its result still shows
  # on every run.
  check_macos:
    name: make check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew list openssl@3 sqlite >/dev/null 2>&1 || brew install openssl@3 sqlite
      - name: build
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests and both smoke lanes
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check

  # Linux arm64: the shipped binary's own architecture (cbase-vm is a t4g.nano), which `check`
  # above, on x86_64, never sees. Two arm64-only failures hid there: hand_contract_test's digest
  # (GCC 13's -flto build left stack bytes in a struct's padding, and its fused object never fused,
  # since GCC before 14 implements -ffp-contract=on as off) and the num fuzz target's link (UBSan's
  # signed 128-bit multiply check calls __muloti4 on aarch64, which libgcc does not carry). So
  # c_base's suite, the kernel's suites at volume and every fuzz target's link run here too.
  check_arm64:
    name: make check, kernel volume and fuzz build (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      - name: build
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests and both smoke lanes
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check
      - name: the kernel's suites at volume (tests, hand_contract_test, msg_wire_test 20, analyse_test)
        run: make -C foolish/c -j"$(getconf _NPROCESSORS_ONLN)" volume
      - name: every fuzz target builds and links
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz

  asan:
    name: make check-asan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: unit tests and smoke under ASan + UBSan
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check-asan
      # Every checked-in fuzz input (each target's <side>/fuzz/corpus, the reproducers of
      # every bug the fuzzers found among them) through its target once,
      # under the same sanitizers, with gcc and no libFuzzer.
      - name: the fuzz corpus as a regression test
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz-replay

  # THE CLIENT's wasm half (c_base/client, CLIENT_DESIGN.md): the module built with the pinned clang,
  # held to its size budget, its TypeScript generated by structgen, and the page shim's tests run
  # against it. (Its C tests run in `check` above, through c_base's own `make check`.)
  client:
    name: client wasm, size gate and shim tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Toolchain (the repo's pinned clang and libclang)
        run: bash shared/scripts/ci_llvm.sh
      - name: the module and its size gate
        run: make -C c_base/client wasm
      - name: the page shim's tests over the module
        run: make -C c_base/client ts-test

  # THE FUZZ STAGE: one job per target, in parallel, each 30 s from its corpus
  # (c_base_fuzz_nightly.yml and product_fuzz_nightly.yml are the same shape
  # at 10 min). The targets are three builds' (fuzz_select.sh's header): c_base's
  # (<t>), c_base/client's (client:<t>) and shared/fuzz's products
  # (product:<t>). fuzz_targets says which: on a push to main or a dispatch
  # every target of the three (fuzz_select.sh --all); on a pull request only
  # the targets built from a file it changes
  # (.github/scripts/fuzz_select.sh: link line, nm reachability, the
  # compiler's dependency files, and the build's own commands against the
  # base's, so a makefile edit reruns the targets whose compile or link it
  # changes), and none for a doc, this workflow or the script.
  fuzz_targets:
    name: fuzz targets to run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      # The whole history (trees only, no blobs) so a pull request can diff
      # against its base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - name: dependencies (pull request)
        if: github.event_name == 'pull_request'
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      # The selection reads the objects of the fuzz build.
      - name: build every target (pull request)
        if: github.event_name == 'pull_request'
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FUZZ_SELECT_STATS: '1'
        run: |
          if [ "$EVENT" = pull_request ]; then
            t=$(.github/scripts/fuzz_select.sh --base "$BASE" --head "$HEAD")
            [ -n "$t" ] || echo "No fuzz target is built from a file this pull request changes: nothing to fuzz."
          else
            t=$(.github/scripts/fuzz_select.sh --all)
          fi
          echo "targets=$(tr ' ' '\n' <<< "$t" | sed '/^$/d' | jq -R . | jq -sc .)" | tee -a "$GITHUB_OUTPUT"

  # The selector's own test (c_base/fuzz/test/fuzz_select_test.sh): synthetic
  # diffs and base trees with one makefile edited, over a real fuzz build. Its
  # own job, so the fuzz stage does not wait on it.
  fuzz_select_test:
    name: fuzz_select.sh picks the targets a change reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      - name: build every target
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" fuzz
      - name: the selector's test
        run: bash c_base/fuzz/test/fuzz_select_test.sh

  fuzz:
    name: fuzz-smoke ${{ matrix.target }} (30 s)
    needs: fuzz_targets
    # An empty list never expands into a matrix (that would fail the run).
    if: needs.fuzz_targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz_targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      # The name's prefix says the build (fuzz_select.sh's header): its
      # directory, its binary, its smoke goal and where a crash lands.
      - id: where
        env:
          T: ${{ matrix.target }}
        run: |
          case "$T" in
            client:*)  t=${T#client:}
                       echo "dir=c_base/client"; echo "bin=build/fuzz/$t"
                       echo "smoke=fuzz-smoke FUZZ_TIME=30"; echo "crashes=c_base/client/build/fuzz-crashes" ;;
            product:*) t=${T#product:}
                       echo "dir=shared/fuzz"; echo "bin=build/$t"
                       echo "smoke=smoke TARGETS=$t FUZZ_TIME=30"; echo "crashes=shared/fuzz/build/crashes/$t" ;;
            *:*)       echo "fuzz target $T: no build has that prefix" >&2; exit 1 ;;
            *)         echo "dir=c_base"; echo "bin=build/fuzz/$T"
                       echo "smoke=fuzz-smoke FUZZ_TIME=30 FUZZ_TARGETS=$T"; echo "crashes=c_base/build/fuzz-crashes/$T" ;;
          esac >> "$GITHUB_OUTPUT"
          echo "artifact=fuzz-crashes-${T/:/-}" >> "$GITHUB_OUTPUT"
      - name: build
        run: make -C ${{ steps.where.outputs.dir }} -j"$(getconf _NPROCESSORS_ONLN)" ${{ steps.where.outputs.bin }}
      - name: 30 s from its corpus
        run: make -C ${{ steps.where.outputs.dir }} ${{ steps.where.outputs.smoke }}
      - name: the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.where.outputs.artifact }}
          path: ${{ steps.where.outputs.crashes }}
          if-no-files-found: ignore
          retention-days: 30

  # One check for the whole stage, green when every selected target passed or
  # none was selected (the matrix skipped), and what deploy waits on.
  fuzz_done:
    name: make fuzz-smoke (every selected target)
    needs: [fuzz_targets, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          LIST: ${{ needs.fuzz_targets.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          echo "target list: $LIST, targets: $FUZZ"
          [ "$LIST" = success ] && { [ "$FUZZ" = success ] || [ "$FUZZ" = skipped ]; }

  # c_base/docs/COVERAGE.md: line and branch floors, and no function that no
  # test calls (tools/cov_floor.txt names the ones allowed, with a reason).
  coverage:
    name: make coverage (floors, no function at zero)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: gcovr
        run: pipx install gcovr==8.6 || pip install --break-system-packages gcovr==8.6
      - name: the coverage build, every test, the gate
        run: make -C c_base -j"$(nproc)" coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cbase-coverage
          path: |
            c_base/build/cov/report.txt
            c_base/build/cov/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  dynamo:
    name: make check-dynamo (DynamoDB Local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      # The runner image has Docker and the AWS CLI; dynamo_local.sh starts
      # amazon/dynamodb-local (pinned by digest) and makes the table from
      # providers/aws/ops/cbase.yaml.
      - name: DynamoDB Local
        run: c_base/providers/aws/ops/dynamo_local.sh > /dev/null
      - name: the store, admin and import tests and the game smoke, on DynamoDB
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" check-dynamo
      - name: stop DynamoDB Local
        if: always()
        run: c_base/providers/aws/ops/dynamo_local.sh --stop

  ops:
    name: template and scripts
    runs-on: ubuntu-24.04
    steps:
      # The submodule is the deploy tool the role check reads.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: the CloudFormation template (cfn-lint, no AWS calls)
        run: |
          python3 -m venv /tmp/cfn
          /tmp/cfn/bin/pip install -q cfn-lint==1.57.2
          /tmp/cfn/bin/cfn-lint --regions us-east-1 -- c_base/providers/aws/ops/cbase.yaml c_base/providers/aws/ops/site/web.yaml c_base/providers/aws/ops/github_oidc.yaml c_base/providers/local/ops/vm.yaml
      - name: the shell scripts
        run: |
          bash -n c_base/providers/aws/ops/package.sh c_base/providers/aws/ops/build_bootstrap.sh c_base/providers/aws/ops/eol_guard.sh c_base/providers/aws/ops/dynamo_local.sh c_base/providers/aws/ops/site/web_deploy.sh c_base/providers/aws/ops/lambda_deploy.sh c_base/ops/require_main.sh c_base/ops/ops_env.sh c_base/ops/s3_prune_lib.sh c_base/ops/s3_prune.sh c_base/providers/aws/ops/deploy.sh c_base/providers/local/ops/vm_release.sh c_base/providers/local/ops/vm_deploy.sh c_base/providers/local/ops/vm_boot.sh c_base/providers/local/ops/vm_boot_stub.sh c_base/providers/local/ops/vm_boot_lib.sh c_base/providers/local/ops/test/vm_boot_stub_test.sh c_base/providers/local/ops/test/vm_release_boot_test.sh
          shellcheck -x .github/scripts/fuzz_select.sh c_base/providers/aws/ops/package.sh c_base/providers/aws/ops/build_bootstrap.sh c_base/providers/aws/ops/eol_guard.sh c_base/providers/aws/ops/dynamo_local.sh c_base/providers/aws/ops/site/web_deploy.sh c_base/providers/aws/ops/lambda_deploy.sh c_base/ops/require_main.sh c_base/ops/test/web_deploy_gate_test.sh c_base/ops/ops_env.sh c_base/ops/s3_prune_lib.sh c_base/ops/s3_prune.sh c_base/ops/test/s3_prune_test.sh c_base/ops/test/ops_env_test.sh c_base/providers/aws/ops/test/changeset_gate_test.sh c_base/providers/aws/ops/role_covers_deploy.sh c_base/providers/aws/ops/test/role_covers_deploy_test.sh c_base/providers/local/ops/vm_release.sh c_base/providers/local/ops/vm_deploy.sh c_base/providers/local/ops/vm_boot.sh c_base/providers/local/ops/vm_boot_stub.sh c_base/providers/local/ops/vm_boot_lib.sh c_base/providers/local/ops/test/vm_boot_logs_test.sh c_base/providers/local/ops/test/vm_boot_handover_test.sh c_base/providers/local/ops/test/vm_boot_stub_test.sh c_base/providers/local/ops/test/vm_release_boot_test.sh c_base/fuzz/test/fuzz_mk_test.sh c_base/fuzz/test/fuzz_select_test.sh
      - name: web_deploy.sh, vm_release.sh and lambda_deploy.sh refuse a tree behind main (no AWS calls)
        run: bash c_base/ops/test/web_deploy_gate_test.sh
      - name: ops_env.sh never generates a secret for a live stack (no AWS calls)
        run: bash c_base/ops/test/ops_env_test.sh
      - name: the release prune keeps live and its predecessor and nothing else is touched (no AWS calls)
        run: bash c_base/ops/test/s3_prune_test.sh
      - name: vm_boot.sh keeps system logs in RAM and chrony quiet, idempotently (no AWS calls)
        run: bash c_base/providers/local/ops/test/vm_boot_logs_test.sh
      - name: the boot leaves cbase.service alone once ./cbase's socket unit holds the server (vm_boot.sh 2c)
        run: bash c_base/providers/local/ops/test/vm_boot_handover_test.sh
      - name: the user-data stub is tiny, and fetches, checks and runs the pinned boot script, keeping the old one on any failed check (no AWS calls)
        run: bash c_base/providers/local/ops/test/vm_boot_stub_test.sh
      - name: vm_release.sh pins the boot script before the stub runs and prunes the old boot objects after the checks (no AWS calls)
        run: bash c_base/providers/local/ops/test/vm_release_boot_test.sh
      - name: deploy.sh's replacement gate on recorded change sets (no AWS calls)
        run: bash c_base/providers/aws/ops/test/changeset_gate_test.sh
      - name: the GitHub deploy role grants every AWS call ./cbase deploy makes in CI (no AWS calls)
        run: bash c_base/providers/aws/ops/test/role_covers_deploy_test.sh
      - name: fuzz.mk's targets, one name per root, and fuzz-seeds beside each target (no fuzzer, no build)
        run: bash c_base/fuzz/test/fuzz_mk_test.sh
      - name: the web router's rules (providers/aws/ops/site/web.yaml's Function code)
        run: node --test c_base/providers/aws/ops/site/test/web_router.test.mjs

  # `cbase serve` for the cbase-vm instance (an EC2 t4g.nano behind the
  # CloudFront): the pinned Alpine static build (providers/aws/ops/build_bootstrap.sh
  # serve) on GitHub's native arm64 runner. Every run builds it, so a pull
  # request proves the shipped build; on main it is also kept as a GitHub
  # release cbase-serve-<short sha> with its sha256, and the deploy job ships it.
  # contents: write is on this job alone.
  serve_binary:
    name: cbase serve (Linux arm64, static)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: c_base/providers/aws/ops/build_bootstrap.sh serve
      - name: check the binary is arm64 and static, and the sha256 matches
        run: |
          cd c_base/dist
          file cbase-serve-linux-arm64 | grep -E 'ARM aarch64.*(statically|static-pie) linked'
          sha256sum -c cbase-serve-linux-arm64.sha256
      - name: the pinned Alpine and the built-in OpenSSL are inside their support windows
        run: c_base/providers/aws/ops/eol_guard.sh c_base/dist/cbase-serve-linux-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: cbase-serve-linux-arm64
          path: |
            c_base/dist/cbase-serve-linux-arm64
            c_base/dist/cbase-serve-linux-arm64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: release cbase-serve-<short sha>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="cbase-serve-$(git rev-parse --short=9 HEAD)"
          # A re-run of this commit's run (a rollback, c_base/RUNBOOK.md 13) finds its release made.
          if gh release view "$tag" > /dev/null 2>&1; then echo "release $tag exists: kept"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "cbase serve, Linux arm64, static (musl). Built from $GITHUB_SHA." \
            c_base/dist/cbase-serve-linux-arm64 c_base/dist/cbase-serve-linux-arm64.sha256


  # The two static exports the deploy uploads: web_aws.yml's `foolish` and `uttt` jobs (the
  # same build each site's pull requests are gated on), called in this run, so their artifacts
  # foolish-out and uttt-out are this run's own. Only where the deploy runs.
  web:
    name: static exports
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/web_aws.yml

  deploy:
    name: deploy foolish.cards, api.foolish.cards and uttt.live (./cbase)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, check_arm64, asan, fuzz_done, dynamo, ops, serve_binary, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One deploy at a time, and the newest always deploys: the workflow's
    # concurrency group above. No job-level group here: a second queue would
    # order deploys by which build finished first, not by push.
    permissions:
      contents: read
      id-token: write   # the OIDC token configure-aws-credentials exchanges for the role
    env:
      AWS_REGION: us-east-1
      # The header's LIVE OR DRY, decided once here: every step reads MODE.
      MODE: ${{ (inputs.dry_run || vars.CBASE_DEPLOY != 'live') && 'dry' || 'live' }}
    steps:
      - name: is the deploy secret set, and is this run live
        env:
          ROLE_ARN: ${{ secrets.CBASE_AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::CBASE_AWS_ROLE_ARN is not set: main did not deploy (c_base/RUNBOOK.md, GitHub deploys)."
            exit 1
          fi
          if [ "$MODE" = live ]; then
            echo "live deploy of $GITHUB_SHA"
          else
            echo "::warning::DRY RUN: nothing is deployed (dry_run ticked, or the repository variable CBASE_DEPLOY is not 'live'; c_base/RUNBOOK.md, GitHub deploys)."
          fi
      # The submodule is the deploy tool (cbase/tools/cbase), at the pin this commit names.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v7
        with:
          name: cbase-serve-linux-arm64
          path: c_base/dist
      - uses: actions/download-artifact@v7
        with:
          name: foolish-out
          path: foolish/out
      - uses: actions/download-artifact@v7
        with:
          name: uttt-out
          path: uttt/web/out
      - name: the server's sha256, and the exports' shells
        run: |
          (cd c_base/dist && sha256sum -c cbase-serve-linux-arm64.sha256)
          test -f foolish/out/_shell.html && test -f foolish/out/.well-known/apple-app-site-association
          test -f uttt/web/out/_shell.html && test -f uttt/web/out/uttt.wasm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CBASE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # foolish first: its server, then its files, then its stack (./cbase deploy's own order).
      # Never --accept-drift, --allow-downtime or --prune: a refusal fails the job.
      - name: foolish - the server on cbase-vm, out/, cbase-app-foolish
        working-directory: foolish
        env:
          CBASE_SERVE_BIN: ../c_base/dist/cbase-serve-linux-arm64
        run: |
          if [ "$MODE" = live ]; then ../cbase/tools/cbase deploy; else ../cbase/tools/cbase deploy --dry-run; fi
      - name: uttt - web/out, cbase-app-uttt
        working-directory: uttt
        run: |
          if [ "$MODE" = live ]; then ../cbase/tools/cbase deploy; else ../cbase/tools/cbase deploy --dry-run; fi
      - name: the API and both sites answer
        if: env.MODE == 'live'
        run: |
          # Each is tried for up to a minute: the edge has just been invalidated.
          check() {   # check URL WANT: WANT is an HTTP status, or text the body holds
            local n=0 code body
            while :; do
              body="$(curl -sS --max-time 20 -w '\n%{http_code}' "$1" 2>&1)" || true
              code="${body##*$'\n'}"
              case "$2" in
                [0-9][0-9][0-9]) [ "$code" = "$2" ] && { echo "$1 $code"; return 0; } ;;
                *) [ "$code" = 200 ] && [[ "$body" == *"$2"* ]] && { echo "$1 $code: $2"; return 0; } ;;
              esac
              n=$((n + 1))
              [ "$n" -lt 6 ] || { echo "::error::$1 answered $code, not $2"; return 1; }
              sleep 10
            done
          }
          check https://api.foolish.cards/health "ok cbase"
          check https://foolish.cards/ 200
          check https://uttt.live/ 200
