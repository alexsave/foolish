# Chui Niu's portable gate, from the monorepo root, in pickemup.yml's shape
# (GitHub reads workflows from the repository root's .github/workflows only).
#
#   tests      the kernel, the wire and the bridge, and the same again under
#              ASan + UBSan
#   generated  the Swift the app compiles, written from the kernel's headers
#              by shared/tools/structgen and datagen - both libclang programs,
#              so this job installs the repo's pinned toolchain first
#
# What this cannot run is the Xcode half (`make ios-lib`, `make swift-smoke`):
# macOS runners bill at 10x Linux. `ios-smoke` runs the same bridge with the
# host compiler inside `make run`, so a broken entry point still fails here.
#
# No wasm target is run here: foolish/e2e/validation/ci_toolchain_validation
# reads any `make ... wasm` line in any workflow as a build of foolish's test
# module and requires foolish's prebuild script before it.
name: chuiniu

on:
  push:
    branches: [main]
    paths:
      - 'chuiniu/**'
      # All of shared/, for the same reason as pickemup.yml: a narrower list
      # goes stale the first time the kernel uses another shared file.
      - 'shared/**'
      - '.github/workflows/chuiniu.yml'
  pull_request:
    branches: [main]
    paths:
      - 'chuiniu/**'
      - 'shared/**'
      - '.github/workflows/chuiniu.yml'
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chuiniu
    steps:
      - uses: actions/checkout@v4
      # Every test binary and the bridge smoke. It compiles deal_rng and
      # sha256 from ../../shared/c, so this lane also checks that the shared
      # half still builds for this product under -Werror.
      - name: kernel, wire and bridge
        run: make -C c run
      # A separate run and not a flag on the one above, because the sanitizers
      # change codegen: the plain build is the code that ships.
      - name: the same suite under ASan + UBSan
        run: make -C c asan

  generated:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chuiniu
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (the repo's pinned clang and libclang)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh
      # The readers for every struct cn_api.h hands Swift, and the string
      # tables. A header change that structgen cannot read, or a key a table
      # lacks, fails here and not in Xcode.
      - name: structgen and datagen
        run: make -C c structgen datagen
      - name: the generated files exist
        run: |
          test -s ios/Generated/ChuiniuKernel.swift
          test -s ios/Generated/i18n/ChuiniuStringKeys.swift
          test -s ios/Generated/i18n/ChuiniuStringsEn.swift
          grep -q 'SG_LAYOUT_HASH' ios/Generated/ChuiniuKernel.swift
