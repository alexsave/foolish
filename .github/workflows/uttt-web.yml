name: uttt-web

# RETIRED AS A DEPLOY LANE ON 2026-10-14. uttt.live is built, tested and
# deployed by web_aws.yml (S3 + CloudFront), whose `uttt` job runs this file's
# `build` steps on every pull request. This file is kept only as the Vercel
# rollback: Actions > uttt-web > Run workflow, on main, deploys production to
# Vercel (DNS has to point back at Vercel for it to matter, c_base/RUNBOOK.md
# "W7"). DELETE THIS FILE after 2026-10-28, two weeks after the cutover, with
# the rest of c_base/RUNBOOK.md "W9".
#
# uttt.live - Ultimate Tic-Tac-Toe's replay site (uttt/web). Built HERE and
# uploaded, like the foolish site (web.yml) and for the same reason: the page
# runs the uttt kernel as wasm (uttt/c `make wasm-web`), a build output that is
# never committed, and Vercel's build image has no clang to make it.
#
#   build    on every pull request and push that touches the site or the
#            kernel: the wasm (both modules, and the readers structgen writes
#            for the 243 page - a libclang program, which ci_llvm.sh
#            installs), a typecheck, the module tests and `next build`. No
#            secrets.
#   deploy   production, on a push to main only. Previews are not deployed:
#            Vercel's free plan's 100 deployments a day are shared with the
#            foolish site (web.yml's scope job has the story).
#
# The secrets: VERCEL_TOKEN and VERCEL_ORG_ID are the ones web.yml already
# uses; UTTT_VERCEL_PROJECT_ID is the uttt project's own id (uttt/web/README.md).

on:
  workflow_dispatch: {}

concurrency:
  group: uttt-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: uttt/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json
      - name: Toolchain (the repo's pinned clang and libclang, for the wasm and structgen)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh
      - run: npm ci
      - name: The kernel, as wasm
        run: npm run wasm
      - run: npm run typecheck
      - name: The 243 page's module against its kernel
        run: npm test
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.UTTT_VERCEL_PROJECT_ID }}
    steps:
      - name: Are the deploy credentials present?
        id: creds
        working-directory: .
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing UTTT_VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::uttt.live did not deploy - missing secrets:$missing (see uttt/web/README.md)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json
      - name: Toolchain
        if: steps.creds.outputs.ready == 'true'
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Install the Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@59.23.1
      - name: Vercel build
        if: steps.creds.outputs.ready == 'true'
        # The SERVER build, with next.config.mjs's rewrites: without VERCEL=1
        # the app builds as a static export for S3 (web_aws.yml). Vercel's CLI
        # sets it too; it is stated here so this lane never depends on that.
        env:
          VERCEL: '1'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Vercel deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployed: $url"
          { echo "### uttt.live deployed"; echo; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
