# The web on AWS (c_base/ops/web.yaml): foolish.cards and uttt.live built here
# as static exports and uploaded to S3 behind CloudFront by
# c_base/ops/web_deploy.sh. This is the web's only deploy lane; web.yml and
# uttt-web.yml (Vercel) are workflow_dispatch-only rollbacks until they are
# deleted (c_base/RUNBOOK.md, "W9").
#
#   foolish   gen, wasm, `next build` (out/): the compile gate web.yml's
#             `build` job used to be, on every pull request that touches the site
#   uttt      the uttt wasm, typecheck, the 243 page's module tests, `next
#             build` (out/): the gate uttt-web.yml's `build` job used to be
#   deploy    on a push to main, or a workflow_dispatch from main: both exports,
#             foolish then uttt (each rewrites the cbase-web stack's page list,
#             and two stack updates cannot overlap), each upload gated on the
#             tree containing origin/main
#
# The template and the router's tests are c_base.yml's (its ops job). A
# template change is deployed by hand (web_deploy.sh stack): this lane only
# uploads, and rewrites the page lists.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CBASE_AWS_ROLE_ARN   the cbase-github stack's DeployRoleArn
#                        (c_base/ops/github_oidc.yaml; OIDC, no keys, main only)
#   CBASE_ANON_KEY       the cbase stack's AnonKey (c_base/ops/.env), which the
#                        bundle sends as `apikey`; public once shipped, a secret
#                        here only so it lives in one place
# The backend URL is not a secret: NEXT_PUBLIC_SUPABASE_URL is
# https://api.foolish.cards.
name: web_aws

on:
  push:
    branches: [main]
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - 'c_base/ops/require_main.sh'
      - '.github/workflows/web_aws.yml'
  pull_request:
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - 'c_base/ops/require_main.sh'
      - '.github/workflows/web_aws.yml'
  workflow_dispatch: {}

concurrency:
  group: web_aws-${{ github.ref }}
  # A deploy half done is worse than a late one: cancel only pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  NEXT_PUBLIC_SUPABASE_URL: https://api.foolish.cards
  # The one place that says which runs deploy; every job reads it.
  DEPLOYS: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/c_base-deployci') }}

jobs:
  foolish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foolish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Toolchain (libclang and wasm clang)
        run: bash ../shared/scripts/ci_llvm.sh

      - name: Generated modules
        run: bash tools/structgen/gen.sh

      - name: Shipped wasm modules
        run: bash scripts/wasm_build.sh

      # The real key only on a deploying run; anything else builds against a
      # placeholder (a compile gate) and never deploys. `next build` prerenders
      # /_not-found and friends, and the module that creates the client throws
      # at module scope without a well-formed pair, so the gate needs one.
      - name: Build the static export
        env:
          ANON_KEY: ${{ secrets.CBASE_ANON_KEY }}
        run: |
          if [ "$DEPLOYS" = true ]; then
            if [ -z "$ANON_KEY" ]; then
              echo "::error::CBASE_ANON_KEY is not set: main cannot build the site it deploys (.github/workflows/web_aws.yml header)."
              exit 1
            fi
            export NEXT_PUBLIC_SUPABASE_KEY="$ANON_KEY"
          else
            export NEXT_PUBLIC_SUPABASE_KEY=placeholder-anon-key-not-used-by-this-job
          fi
          npx next build
          test -f out/index.html && test -f out/_shell.html && test -f out/.well-known/apple-app-site-association
          du -sh out

      - uses: actions/upload-artifact@v4
        if: env.DEPLOYS == 'true'
        with:
          name: foolish-out
          path: foolish/out
          include-hidden-files: true   # .well-known/apple-app-site-association
          if-no-files-found: error
          retention-days: 7

  uttt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uttt/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json

      - name: Toolchain (the repo's pinned clang and libclang, for the wasm and structgen)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh

      - run: npm ci

      - name: The kernel, as wasm
        run: npm run wasm

      - run: npm run typecheck

      - name: The 243 page's module against its kernel
        run: npm test

      - name: Build the static export
        run: |
          npm run build
          test -f out/index.html && test -f out/_shell.html && test -f out/uttt.wasm
          du -sh out

      - uses: actions/upload-artifact@v4
        if: env.DEPLOYS == 'true'
        with:
          name: uttt-out
          path: uttt/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [foolish, uttt]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/c_base-deployci')
    runs-on: ubuntu-latest
    concurrency:
      group: web-aws-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # the OIDC token configure-aws-credentials exchanges for the role
    steps:
      - name: is the deploy secret set
        env:
          ROLE_ARN: ${{ secrets.CBASE_AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::CBASE_AWS_ROLE_ARN is not set: main did not deploy (.github/workflows/web_aws.yml header)."
            exit 1
          fi

      # For web_deploy.sh and its main-ancestry gate (require_main.sh).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: foolish-out
          path: foolish/out

      - uses: actions/download-artifact@v4
        with:
          name: uttt-out
          path: uttt/web/out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CBASE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: foolish.cards - upload, route, invalidate
        run: c_base/ops/web_deploy.sh site foolish --out foolish/out

      - name: uttt.live - upload, route, invalidate
        run: c_base/ops/web_deploy.sh site uttt --out uttt/web/out

      - name: the sites answer
        run: |
          for u in https://www.foolish.cards/ https://www.uttt.live/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
            echo "$u $code"
            [ "$code" = 200 ] || { echo "::error::$u answered $code"; exit 1; }
          done
