# The web on AWS (c_base/ops/web.yaml): foolish.cards and uttt.live built here
# as static exports and uploaded to S3 behind CloudFront by
# c_base/ops/web_deploy.sh. It is the only deploy lane for both sites;
# web.yml and uttt-web.yml (Vercel) are workflow_dispatch-only rollbacks until
# they are deleted (c_base/RUNBOOK.md, "W9").
#
#   foolish   gen, wasm, `next build` (out/): the compile gate web.yml's
#             `build` job used to be, on every pull request that touches the site
#   uttt      the uttt wasm, typecheck, the 243 page's module tests, `next
#             build` (out/), the gate uttt-web.yml's `build` job used to be
#   deploy    on a push to main, or a workflow_dispatch from main: both exports,
#             foolish then uttt (each rewrites the cbase-web stack's page list,
#             and two stack updates cannot overlap), each upload gated on the
#             tree containing origin/main, or being a commit of main whose
#             newer push's run is queued behind this one. One run on main at
#             a time (the workflow's concurrency group, never cancelled
#             mid-way: that would stop a stack update half done); a newer
#             push's run waiting behind it replaces any older one still
#             waiting, and every run that starts deploys its own commit
#             (c_base/ops/require_main.sh, QUEUED), so the newest commit of
#             main always deploys
#
# The template and the router's tests are c_base.yml's (its ops job). A
# template change is deployed by hand (web_deploy.sh stack): this lane only
# uploads, and rewrites the page lists.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CBASE_AWS_ROLE_ARN   the cbase-github stack's DeployRoleArn
#                        (c_base/ops/github_oidc.yaml; OIDC, no keys, main only)
# The backend URL is not a secret: NEXT_PUBLIC_BACKEND_URL is
# https://api.foolish.cards, and the binary surface the bundle speaks has no
# anon key.
name: web_aws

on:
  push:
    branches: [main]
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - 'c_base/ops/require_main.sh'
      - '.github/workflows/web_aws.yml'
  pull_request:
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - 'c_base/ops/require_main.sh'
      - '.github/workflows/web_aws.yml'
  workflow_dispatch: {}

# THE DEPLOY QUEUE, and its one owner (the header's deploy paragraph). A
# deploy half done is worse than a late one: cancel only pull request runs.
concurrency:
  group: web_aws-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  NEXT_PUBLIC_BACKEND_URL: https://api.foolish.cards
  # The one place that says which runs deploy; every job reads it.
  DEPLOYS: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

jobs:
  foolish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foolish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Toolchain (libclang and wasm clang)
        run: bash ../shared/scripts/ci_llvm.sh

      - name: Generated modules
        run: bash tools/structgen/gen.sh

      - name: Shipped wasm modules
        run: bash scripts/wasm_build.sh

      - name: Build the static export
        run: |
          npx next build
          test -f out/index.html && test -f out/_shell.html && test -f out/.well-known/apple-app-site-association
          du -sh out

      - uses: actions/upload-artifact@v4
        if: env.DEPLOYS == 'true'
        with:
          name: foolish-out
          path: foolish/out
          include-hidden-files: true   # .well-known/apple-app-site-association
          if-no-files-found: error
          retention-days: 7

  uttt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uttt/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json

      - name: Toolchain (the repo's pinned clang and libclang, for the wasm and structgen)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh

      - run: npm ci

      - name: The kernel, as wasm
        run: npm run wasm

      - run: npm run typecheck

      - name: The 243 page's module against its kernel
        run: npm test

      - name: Build the static export
        run: |
          npm run build
          test -f out/index.html && test -f out/_shell.html && test -f out/uttt.wasm
          du -sh out

      - uses: actions/upload-artifact@v4
        if: env.DEPLOYS == 'true'
        with:
          name: uttt-out
          path: uttt/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [foolish, uttt]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and the newest always deploys: the workflow's
    # concurrency group above. No job-level group here: a second queue would
    # order deploys by which build finished first, not by push.
    permissions:
      contents: read
      id-token: write   # the OIDC token configure-aws-credentials exchanges for the role
    steps:
      - name: is the deploy secret set
        env:
          ROLE_ARN: ${{ secrets.CBASE_AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::CBASE_AWS_ROLE_ARN is not set: main did not deploy (.github/workflows/web_aws.yml header)."
            exit 1
          fi

      # For web_deploy.sh and its main-ancestry gate (require_main.sh).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: foolish-out
          path: foolish/out

      - uses: actions/download-artifact@v4
        with:
          name: uttt-out
          path: uttt/web/out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CBASE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: foolish.cards - upload, route, invalidate
        run: c_base/ops/web_deploy.sh site foolish --out foolish/out

      - name: uttt.live - upload, route, invalidate
        run: c_base/ops/web_deploy.sh site uttt --out uttt/web/out

      - name: the sites answer
        run: |
          for u in https://www.foolish.cards/ https://www.uttt.live/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
            echo "$u $code"
            [ "$code" = 200 ] || { echo "::error::$u answered $code"; exit 1; }
          done
