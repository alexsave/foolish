# The web's builds: foolish.cards and uttt.live as static exports, each a compile gate on the
# pull requests that touch its site, and on main the files the deploy uploads.
#
#   foolish   gen, wasm, `next build` (out/): the compile gate
#   uttt      the uttt wasm, typecheck, the 243 page's module tests, `next
#             build` (out/), the compile gate
#
# This workflow deploys nothing. On main, c_base.yml's `web` job calls it
# (workflow_call) in c_base's own run, so both exports are uploaded as that
# run's artifacts foolish-out and uttt-out, and c_base.yml's `deploy` job hands
# them to ./cbase deploy with the server, after every gate (c_base.yml's header;
# c_base/RUNBOOK.md, "GitHub deploys"). It has no push trigger of its own: a
# push to main that touches a site starts c_base.yml, which runs these builds.
#
# The backend URL is not a secret: NEXT_PUBLIC_BACKEND_URL is
# https://api.foolish.cards, and the binary surface the bundle speaks has no
# anon key.
name: web_aws

on:
  pull_request:
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - '.github/workflows/web_aws.yml'
  workflow_call: {}

# Pull request runs are cancelled by newer pushes to the same pull request.
# Called from c_base.yml on main, the group is never contended: c_base's own
# concurrency group already runs one main run at a time.
concurrency:
  group: web_aws-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_PUBLIC_BACKEND_URL: https://api.foolish.cards
  # The one place that says which runs keep the exports: the deploy's (called
  # from c_base.yml), not a pull request's. Every job reads it.
  KEEPS_EXPORTS: ${{ github.event_name != 'pull_request' }}

jobs:
  foolish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foolish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Toolchain (libclang and wasm clang)
        run: bash ../shared/scripts/ci_llvm.sh

      - name: Generated modules
        run: bash tools/structgen/gen.sh

      - name: Shipped wasm modules
        run: bash scripts/wasm_build.sh

      # The game's sounds (tools/soundgen, docs/AUDIO.md): rendered in C and
      # encoded to AAC by ffmpeg, which the image may not carry. The table they
      # are played by is C, linked into web.wasm by the step above.
      - name: Sounds
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          npm run sounds

      - name: Build the static export
        run: |
          npx next build
          test -f out/index.html && test -f out/_shell.html && test -f out/.well-known/apple-app-site-association
          du -sh out

      - uses: actions/upload-artifact@v6
        if: env.KEEPS_EXPORTS == 'true'
        with:
          name: foolish-out
          path: foolish/out
          include-hidden-files: true   # .well-known/apple-app-site-association
          if-no-files-found: error
          retention-days: 7

  uttt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uttt/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json

      - name: Toolchain (the repo's pinned clang and libclang, for the wasm and structgen)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh

      - run: npm ci

      - name: The kernel, as wasm
        run: npm run wasm

      - run: npm run typecheck

      - name: The 243 page's module against its kernel
        run: npm test

      - name: Build the static export
        run: |
          npm run build
          test -f out/index.html && test -f out/_shell.html && test -f out/uttt.wasm
          du -sh out

      - uses: actions/upload-artifact@v6
        if: env.KEEPS_EXPORTS == 'true'
        with:
          name: uttt-out
          path: uttt/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
