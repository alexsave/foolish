# The static web on AWS (c_base/ops/web.yaml): foolish.cards and uttt.live
# built here as static exports and uploaded to S3 behind CloudFront by
# c_base/ops/web_deploy.sh. It runs ALONGSIDE web.yml and uttt-web.yml (the
# Vercel lanes) until DNS moves and the two weeks of overlap are over
# (c_base/RUNBOOK.md, "Web hosting"); then those two lose their deploy jobs.
#
#   foolish   gen, wasm, `next build` (out/), and on main the deploy
#   uttt      the uttt wasm, `next build` (out/), and on main the deploy
#
# Every pull request that touches a site builds both exports, so a change that
# breaks the export is red before main. The template and the router's tests
# are c_base.yml's (its ops job). A template change is deployed by hand
# (web_deploy.sh stack): this lane only uploads, and rewrites the page lists.
#
# Deploy secrets (Settings > Secrets and variables > Actions):
#   CBASE_WEB_AWS_ROLE_ARN   the cbase-web stack's DeployRoleArn output (OIDC, no keys;
#                            deploy the stack with CBASE_WEB_GITHUB_REPO=alexsave/foolish)
#   CBASE_ANON_KEY           the cbase stack's AnonKey (c_base/ops/.env), which the
#                            bundle sends as `apikey`; public once shipped, a secret
#                            here only so it lives in one place
# With either missing, the deploy steps say so and do nothing. The backend URL
# is not a secret: NEXT_PUBLIC_SUPABASE_URL is https://api.foolish.cards.
name: web_aws

on:
  push:
    branches: [main]
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - '.github/workflows/web_aws.yml'
  pull_request:
    paths:
      - 'foolish/**'
      - 'shared/**'
      - 'uttt/c/**'
      - 'uttt/web/**'
      - 'c_base/ops/web_deploy.sh'
      - '.github/workflows/web_aws.yml'
  workflow_dispatch: {}

concurrency:
  group: web_aws-${{ github.ref }}
  # A deploy half done is worse than a late one: cancel only pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  NEXT_PUBLIC_SUPABASE_URL: https://api.foolish.cards

jobs:
  foolish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token configure-aws-credentials exchanges for the role
    env:
      ROLE_ARN: ${{ secrets.CBASE_WEB_AWS_ROLE_ARN }}
      ANON_KEY: ${{ secrets.CBASE_ANON_KEY }}
    defaults:
      run:
        working-directory: foolish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Toolchain (libclang and wasm clang)
        run: bash ../shared/scripts/ci_llvm.sh

      - name: Generated modules
        run: bash tools/structgen/gen.sh

      - name: Shipped wasm modules
        run: bash scripts/wasm_build.sh

      # The real key only on main with the secret set; anything else builds
      # against a placeholder (a compile gate, as in web.yml) and never deploys.
      - name: Deploy, or only build?
        id: gate
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ] \
             && [ -n "$ROLE_ARN" ] && [ -n "$ANON_KEY" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.ref }}" = refs/heads/main ]; then
              echo "::notice::CBASE_WEB_AWS_ROLE_ARN or CBASE_ANON_KEY is not set; built, not deployed (.github/workflows/web_aws.yml header)."
            fi
          fi

      - name: Build the static export
        env:
          NEXT_PUBLIC_SUPABASE_KEY: ${{ steps.gate.outputs.go == 'true' && secrets.CBASE_ANON_KEY || 'placeholder-anon-key-not-used-by-this-job' }}
        run: |
          npx next build
          test -f out/index.html && test -f out/_shell.html && test -f out/.well-known/apple-app-site-association
          du -sh out

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.go == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload, route, invalidate
        if: steps.gate.outputs.go == 'true'
        working-directory: .
        run: c_base/ops/web_deploy.sh site foolish --out foolish/out

  uttt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ROLE_ARN: ${{ secrets.CBASE_WEB_AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: uttt/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uttt/web/package-lock.json

      - name: Toolchain (the repo's pinned clang and libclang)
        working-directory: .
        run: bash shared/scripts/ci_llvm.sh

      - run: npm ci

      - name: Build the static export (the kernels first, by the prebuild hook)
        run: |
          npm run build
          test -f out/index.html && test -f out/_shell.html && test -f out/uttt.wasm
          du -sh out

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload, route, invalidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ROLE_ARN != ''
        working-directory: .
        run: c_base/ops/web_deploy.sh site uttt --out uttt/web/out
