name: web

# The web app is BUILT HERE and the output is uploaded, rather than built by
# Vercel from the repository.
#
# WHY. `sdk/ts/gen` is written by tools/structgen, a libclang program that reads
# the C headers. The web imports those modules, so building the site means
# running that generator - and Vercel's build image is not a place this repo can
# install libclang into, or test that it did. Zero-config Vercel worked only
# while the generated modules were committed, which is the arrangement being
# removed (the same arrangement that let verify.wasm rot for months; see
# tools/structgen/gen.sh). So the build moves to the runner that already has the
# toolchain and already proves it works on every pull request, and Vercel goes
# back to being the thing that serves the output.
#
# Three jobs, split by what they need:
#
#   build    `next build` over freshly generated modules. No secrets. This is
#            the gate: it says the site compiles from THIS tree's headers, and
#            it runs on every change whatever the other two decide.
#   scope    on a pull request, can this change reach the served site at all?
#            Vercel's free plan allows 100 deployments a day across the account
#            and this repo has spent them; see the job for the whole story.
#   deploy   `vercel build` + `vercel deploy --prebuilt`. A PREVIEW deployment
#            on a pull request that `scope` says could change the site, the
#            PRODUCTION one on every push to main. The preview is what makes
#            this lane reviewable: a URL, from a real deploy, before the
#            production path depends on it.
#
# THE WASM MODULES ARE BUILT HERE TOO, for exactly the reason above: they stopped
# being committed (scripts/wasm_build.sh), so the same argument that moved the
# build off Vercel now covers three more artifacts. Vercel's image has no clang,
# no wasm-ld and no binaryen, so it could not produce them at all.
#
# ONE THING THE OWNER STILL HAS TO DO, and it is not optional:
#
#   Turn OFF Vercel's automatic deployments for this project. The live setting
#   today is gitProviderOptions.createDeployments = "enabled":
#
#     PATCH https://api.vercel.com/v9/projects/<projectId>?teamId=<orgId>
#     {"gitProviderOptions": {"createDeployments": "disabled"}}
#
#   Until that is off, Vercel ALSO builds every push from source, in an image
#   with no libclang. That is harmless while sdk/ts/gen is still committed and
#   it takes the live site down the moment it is not - so it is flipped as part
#   of the cutover, NOT before: while those modules are still committed, Vercel's
#   source builds are the only thing deploying the site at all.
#
# The three secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are set.
# The org and project ids are read by the CLI from the environment, so nothing
# here needs a checked-in .vercel/ link - and .vercel/ stays gitignored.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` is here so that adding the `preview` label is itself enough to
    # get a URL. Without it the label would only take effect on the next push,
    # which is a trap: you ask for a preview, nothing happens, and there is no
    # message saying why.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Proves the site builds from generated modules with nothing secret
  # involved - so it still means something on the day a token is rotated away.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # `cache: npm` caches ~/.npm, the download cache, keyed on
          # package-lock.json. It changes nothing about what `npm install`
          # RESOLVES - the lockfile still decides that - so it cannot hand two
          # lanes of one commit different dependencies, and on a miss the
          # install is exactly today's. Nine jobs a push install this same
          # tree from this same lockfile; only the fetching is shared.
          cache: npm

      - name: Install dependencies
        run: npm install

      # libclang, then the modules themselves. Generated EXPLICITLY rather than
      # left to the npm pre-hook, so this job's log says which step produced
      # what and a failure names the generator rather than `npm run build`.
      #
      # The hook exists either way - package.json's `prebuild` is `npm run gen
      # && npm run wasm` - and that is deliberate now rather than a hazard. The
      # note that used to be here said a prebuild hook would take Vercel's own
      # automatic builds down, in an image with no libclang. That is still true
      # and is no longer a reason to avoid one: those builds cannot work at all
      # while sdk/ts/gen is uncommitted, which it already is, so they are off.
      - name: Toolchain (libclang, for the generated modules)
        run: bash scripts/ci_llvm.sh

      - name: Generated modules
        run: bash tools/structgen/gen.sh

      # AND THE WASM MODULES, which this lane did not have to build while they
      # were committed. All three: the browser fetches bots.wasm.gz as a bundler
      # asset (sdk/ts/wasm/wasm_asset.ts resolves it with `new URL`, so it has to
      # exist on disk when next build runs), and public/oracle.wasm.gz and
      # public/oracle-mt.wasm.gz are served straight out of public/ - a missing
      # one is a 404 in the Oracle rather than a build failure, which is the
      # worse direction.
      - name: Shipped wasm modules
        run: bash scripts/wasm_build.sh

      # PLACEHOLDER SUPABASE ENV, and the reason is worth stating: `next build`
      # prerenders /_not-found and friends, and the module that creates the
      # Supabase client throws `supabaseUrl is required` at module scope when the
      # variables are absent. The real values live in the Vercel project and
      # arrive through `vercel pull` in the deploy job; this job is a COMPILE
      # gate, so it only needs something well-formed to prerender against. A
      # value that looks real would be worse: it would suggest this job talks to
      # a backend, and it must not.
      - name: Build the web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: placeholder-anon-key-not-used-by-this-job
        run: npm run build

      # Printed, not gated - the same way wasm.yml prints module sizes so a
      # sudden jump is at least visible to a human.
      - name: What the build produced
        if: always()
        run: du -sh .next 2>/dev/null || true

  # Is a preview deployment worth one of the day's hundred?
  #
  # Vercel's free plan allows 100 DEPLOYMENTS per day ACROSS THE ACCOUNT, and on
  # 2026-09-18 this repo spent all of them before the evening:
  #
  #   ✗ Resource is limited - try again in 24 hours
  #     (more than 100, code: "api-deployments-free-per-day")
  #
  # after which every deploy in the repo failed, production included. This is a
  # SECOND quota, distinct from the 5000-uploads/24h one that `--archive=tgz`
  # answers below, and the tarball does nothing for it: one deploy is one deploy
  # however few files it uploads.
  #
  # It was spent rather than earned. `deploy` ran on EVERY push to EVERY pull
  # request, so a day of C, docs and iOS work burned the same budget as web
  # work, and a docs-only push was the one that finally hit the wall.
  #
  # So previews are scoped, by scripts/web_deploy_scope.sh. That list is an
  # INVERSE list on purpose - a path is skippable only when it provably cannot
  # reach the bundle, and anything unrecognised deploys - and
  # e2e/validation/web_deploy_scope_validation.test.ts walks the web's real
  # import graph to prove the skipped prefixes really are unreachable.
  #
  # Production is never scoped. A merge to main always deploys: a stale site
  # costs more than a deployment, and main merges are a couple of dozen a day
  # against a hundred.
  scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Can this change reach the served site?
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "production deploys unconditionally"
            exit 0
          fi

          # OPT-IN. A preview is only built when someone asks for one by
          # labelling the pull request `preview`. Default is no deployment.
          #
          # The quotes here are load-bearing and were wrong once. `run: |` is a
          # YAML BLOCK scalar, so nothing inside it is YAML-quoted and a doubled
          # '' is two literal characters, not an escape. Written as ''preview''
          # the expression reaches Actions as contains(..., ''preview'') , which
          # it refuses - and it refuses the WHOLE FILE, so every job in this
          # workflow disappears rather than one step failing. That is what
          # "This run likely failed because of a workflow file issue" means, and
          # a local YAML parse will not catch it: the file is valid YAML and an
          # invalid expression. Single quotes inside, double quotes outside.
          labelled="${{ contains(github.event.pull_request.labels.*.name, 'preview') }}"
          if [ "$labelled" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "no 'preview' label; not spending a deployment"
            {
              echo "### No preview deployment"
              echo
              echo "Previews are opt-in. Add the **\`preview\`** label to this pull request"
              echo "and push (or re-run this workflow) to get a URL."
              echo
              echo "Why: Vercel's free plan allows **100 deployments per day across the"
              echo "whole account**, and a preview on every push to every pull request"
              echo "spends the budget that merges to \`main\` need. On 2026-09-18 it ran"
              echo "out and production could not deploy for hours."
              echo
              echo "The \`build\` gate still ran and still had to pass, so this pull"
              echo "request is still proven to compile."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Labelled, so someone wants a URL - but a preview of a bundle that
          # cannot differ is still not worth a deployment.
          base='${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags origin "$base" 2>/dev/null || true
          changed=$(git diff --name-only "$base...HEAD" 2>/dev/null || git diff --name-only "$base" HEAD)
          relevant=$(printf '%s\n' "$changed" | bash scripts/web_deploy_scope.sh)

          if [ -z "$relevant" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No preview deployment"
              echo
              echo "This pull request carries the \`preview\` label, but nothing in the"
              echo "change can reach the served site, so the preview would be identical"
              echo "to production."
              echo
              echo "The \`build\` gate still ran and still had to pass."
              echo
              echo '<details><summary>Files changed</summary>'
              echo
              echo '```'
              printf '%s\n' "$changed"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploying; web-relevant files:"
            printf '%s\n' "$relevant"
          fi

  deploy:
    needs: [build, scope]
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # A job that quietly does nothing is a job nobody notices is doing
      # nothing. If a secret is missing this says which, in the log and in the
      # run summary, rather than failing inside the CLI with something
      # unreadable.
      - name: Are the deploy credentials present?
        id: creds
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the web deploy did not run - missing secrets:$missing"
            {
              echo "### The web deploy did not run"
              echo
              echo "Missing repository secrets: \`$missing\`"
              echo
              echo "See the header of .github/workflows/web.yml."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # PRODUCTION only from main. Everything else is a preview, which is what
      # makes a pull request able to prove this lane without touching the site.
      - name: Production or preview?
        id: target
        if: steps.creds.outputs.ready == 'true'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20
          # `cache: npm` caches ~/.npm, the download cache, keyed on
          # package-lock.json. It changes nothing about what `npm install`
          # RESOLVES - the lockfile still decides that - so it cannot hand two
          # lanes of one commit different dependencies, and on a miss the
          # install is exactly today's. Nine jobs a push install this same
          # tree from this same lockfile; only the fetching is shared.
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm install

      - name: Toolchain (libclang, for the generated modules)
        if: steps.creds.outputs.ready == 'true'
        run: bash scripts/ci_llvm.sh

      # Pinned, never floated, for the reason deploy.yml gives for pinning the
      # Supabase CLI: a deploy tool that changes under us changes what ships.
      - name: Install the Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@59.23.1

      # `vercel pull` writes .vercel/project.json into the RUNNER's checkout so
      # `vercel build` has the project's settings and environment. It needs no
      # pre-existing link: VERCEL_ORG_ID and VERCEL_PROJECT_ID in the env are
      # what it resolves the project from. Nothing it writes is committed -
      # .vercel/ is gitignored and this checkout is thrown away.
      #
      # `vercel build` then runs the project's own build command, `npm run
      # build`, in this checkout - so the modules are generated first, into the
      # tree it is about to compile.
      - name: Vercel build
        if: steps.creds.outputs.ready == 'true'
        run: |
          bash tools/structgen/gen.sh
          bash scripts/wasm_build.sh
          vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"
          vercel build ${{ steps.target.outputs.prod }} --token="$VERCEL_TOKEN"

      # --prebuilt: upload .vercel/output, do not build again on their side.
      #
      # --archive=tgz: upload it as ONE tarball rather than as individual files.
      # Without it every deploy uploads the whole output tree file by file, and
      # the free plan allows 5000 uploads per 24 hours across the account - which
      # a Next.js build blows through in a handful of deploys:
      #
      #   Error: Too many requests - try again in 24 hours
      #   (more than 5000, code: "api-upload-free").
      #
      # This lane was born on 2026-09-18 and hit that ceiling the same day, with
      # several branches deploying previews. The old model had Vercel pull from
      # git and upload nothing, so the quota never came up; moving the build here
      # traded a build for thousands of small uploads, and this is the other half
      # of that trade.
      - name: Vercel deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz ${{ steps.target.outputs.prod }} --token="$VERCEL_TOKEN")
          echo "deployed (${{ steps.target.outputs.env }}): $url"
          {
            echo "### Deployed - ${{ steps.target.outputs.env }}"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
