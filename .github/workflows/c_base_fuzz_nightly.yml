# c_base's fuzz targets (c_base/fuzz), every night for 10 minutes each, one
# runner per target. c_base.yml's fuzz job runs each for 30 s on a pull
# request that reaches it (.github/scripts/fuzz_select.sh) and on every push
# to main; this is the long run. A crash fails the target's job and its input
# is uploaded: minimise it (`build/fuzz/<target> -minimize_crash=1 <input>`),
# add it to c_base/fuzz/corpus/<target> and as a unit test, and fix it.
name: c_base fuzz (nightly)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  targets:
    name: list the targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          t=$(ls c_base/fuzz/fz_*.c | sed 's|.*/fz_||; s|\.c$||' | jq -R . | jq -sc .)
          echo "targets=$t" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }} (10 min)
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      - name: build
        run: make -C c_base -j"$(getconf _NPROCESSORS_ONLN)" build/fuzz/${{ matrix.target }}
      - name: fuzz
        run: make -C c_base fuzz-nightly FUZZ_TARGETS=${{ matrix.target }}
      - name: the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: c_base/build/fuzz-crashes/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
