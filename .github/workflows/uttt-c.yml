# Ultimate Tic-Tac-Toe's C kernel, tested (pickemup/docs/REUSE_AUDIT.md S3).
#
# Until this file, no workflow ran uttt's C tests: the site workflow (now
# web_aws.yml's `uttt` job) triggered on uttt/c/** but only built the replay site. So a change to shared/c - which
# uttt compiles sha256, b32 and mixrad out of - could break uttt and stay
# green. This is that missing lane and nothing else; it builds no site and
# touches no Xcode.
name: uttt-c

on:
  push:
    branches: [main]
    paths:
      - 'uttt/c/**'
      - 'shared/c/**'
      # The compile rules uttt/c/Makefile includes, and their own test.
      - 'shared/tools/*.mk'
      - 'shared/tools/c_rules_test.sh'
      - '.github/workflows/uttt-c.yml'
  pull_request:
    branches: [main]
    paths:
      - 'uttt/c/**'
      - 'shared/c/**'
      # The compile rules uttt/c/Makefile includes, and their own test.
      - 'shared/tools/*.mk'
      - 'shared/tools/c_rules_test.sh'
      - '.github/workflows/uttt-c.yml'
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uttt
    steps:
      - uses: actions/checkout@v4
      # How a C file becomes an object, for every product (shared/tools/
      # c_rules.mk), tested before anything is built with it: a header edit
      # recompiles exactly its includers, a changed flag its variant, and a
      # deleted header is not an error. Here because this lane needs nothing
      # but make and a compiler, which is all the test needs.
      - name: the compile rules
        run: bash ../shared/tools/c_rules_test.sh
      # The rules, the message (10,000 games through bytes and text), the
      # words in every language, the motion and the ink.
      - name: kernel and message
        run: make -C c run
      # A separate build: the sanitizers change codegen.
      - name: the same under ASan + UBSan
        run: make -C c asan
      # The iOS bridge (uttt_api.c) with the host compiler: every entry point
      # the Swift side calls, driven phone to phone, no Mac (REUSE_AUDIT S3).
      - name: the iOS bridge smoke
        run: make -C c ios-smoke
