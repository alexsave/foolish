name: memory

# Guards the 2026-07-06 production outage class: workers dying with "Memory
# limit exceeded" on bot turns.
#   mem        — fast Node proxies (e2e/mem): embed parse cost under a capped
#                old-space, and bots.wasm memory bounded + flat across all MC
#                bot families.
# The edge-serve lane (the Supabase edge runtime driving the bots) went with
# the TypeScript server in stage 4; c_base's bots run the kernel natively.

on:
  push:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/memory.yml'
  pull_request:
    branches: [main]
    # foolish/ and the shared/ under it; not the sibling products.
    paths:
      - 'foolish/**'
      - 'shared/**'
      - '.github/workflows/memory.yml'

# Every step runs from foolish/, where these commands have always run. Only the
# path globs and the `uses:`/`working-directory:` inputs are from the repo root.
defaults:
  run:
    working-directory: foolish

jobs:
  mem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # `cache: npm` caches ~/.npm, the download cache, keyed on
          # package-lock.json. It changes nothing about what `npm install`
          # RESOLVES - the lockfile still decides that - so it cannot hand two
          # lanes of one commit different dependencies, and on a miss the
          # install is exactly today's. Nine jobs a push install this same
          # tree from this same lockfile; only the fetching is shared.
          cache: npm
          cache-dependency-path: foolish/package-lock.json

      - name: Install dependencies
        run: npm install

      # The TEST bots module (shipped bots.wasm + test-only exports) is never
      # committed: the fixture and roster helpers load c/build/bots_test.wasm.
      - name: Build the test bots module
        run: bash scripts/ci_bots_test_wasm.sh

      - name: Memory regression suite
        run: npm run test:mem
