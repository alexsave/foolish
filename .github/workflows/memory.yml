name: memory

# Guards the 2026-07-06 production outage class: edge workers dying with
# "Memory limit exceeded" on bot turns. Two layers:
#   mem        — fast Node proxies (e2e/mem): embed parse cost under a capped
#                old-space, and bots.wasm memory bounded + flat across all MC
#                bot families.
#   edge-serve — the gold-path repro: the REAL edge runtime (supabase
#                functions serve) drives semtex/octogen/cordite/fulminate
#                decisions via e2e/edge_memtest and must return 200 with no
#                worker memory kill in the runtime logs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Memory regression suite
        run: npm run test:mem

  edge-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install the diagnostic function
        run: |
          cp -r e2e/edge_memtest server/impls/supabase/functions/memtest
          # memtest runs the real bot stack, so `functions serve` must bundle
          # bots.wasm.gz next to it. Injected HERE, not in committed
          # config.toml: `functions deploy` would try to deploy a memtest
          # function that has no dir at deploy time and fail the deploy.
          printf '\n[functions.memtest]\nstatic_files = [ "../../../sdk/ts/wasm/bots.wasm.gz" ]\n' >> server/impls/supabase/config.toml

      - name: Start local stack (db + edge runtime)
        # memtest is DB-free, but `supabase start` still applies migrations and
        # seed.sql, and neither works on a fresh DB: the base gameplay schema
        # lives in seed.sql (see e2e/README) so migrations reference tables
        # that don't exist yet, and seed.sql itself expects the e2e platform
        # shims (e2e/schema.sql) that the e2e harness applies first. Park the
        # migrations and truncate seed.sql for this run — seeding an empty
        # file is a no-op on every CLI version, and config.toml stays intact.
        run: |
          mv server/impls/supabase/migrations /tmp/parked-migrations
          : > server/impls/supabase/seed.sql
          supabase --workdir server/impls start -x studio,imgproxy,inbucket

      - name: Serve functions
        run: |
          # The bot stack (engine.ts et al.) imports the @api/@sdk aliases; serve
          # resolves them from the per-function deno.json that ships in
          # e2e/edge_memtest (copied in above). Neither config.toml import_map nor
          # the --import-map CLI flag reaches out-of-functions-dir modules like
          # sdk/…/engine.ts — only the function's own deno.json does. Verified
          # against a real local edge runtime.
          supabase --workdir server/impls functions serve --no-verify-jwt > serve.log 2>&1 &
          timeout 90 bash -c 'until curl -sf -o /dev/null "http://127.0.0.1:54321/functions/v1/memtest?games=0"; do sleep 2; done'

      - name: Bot decisions under the real edge memory budget
        run: |
          set -e
          for keys in semtex,octogen cordite,semtex fulminate,octogen; do
            body=$(curl -s -w $'\n%{http_code}' "http://127.0.0.1:54321/functions/v1/memtest?keys=$keys&maxmoves=8")
            code=$(printf '%s' "$body" | tail -n1)
            json=$(printf '%s' "$body" | sed '$d')
            echo "$keys -> $code  $json"
            [ "$code" = "200" ] || { echo "::error::$keys returned $code"; cat serve.log; exit 1; }
            # A green 200 is NOT enough: the diagnostic swallows a per-move
            # exception (e.g. bots.wasm.gz static asset missing) and still
            # returns ok:true with moves:0. Require REAL bot moves — that only
            # happens if the kernel actually loaded and ran.
            printf '%s' "$json" | grep -qE '"moves":[1-9]' \
              || { echo "::error::$keys made 0 bot moves — bots.wasm never loaded (check the static-asset bundle)"; cat serve.log; exit 1; }
          done
          # Catch the swallowed failure class directly in the runtime log:
          # a memory kill, a missing gz asset, or any bot-processing throw.
          if grep -qE "memory limit reached|path not found|Error processing bot action" serve.log; then
            echo "::error::edge runtime logged a bot-processing failure (memory kill / missing asset / throw)"
            cat serve.log
            exit 1
          fi

      - name: Runtime log tail (debug aid)
        if: always()
        run: tail -50 serve.log || true
